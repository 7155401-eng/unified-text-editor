<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <title>ניהול - מערכת תמלול תורה</title>
  <style>
    body {
      font-family: 'Rubik', 'Assistant', Arial, sans-serif;
      background: #f5f7fa;
      color: #1b263b;
      margin: 0;
      padding: 20px;
      direction: rtl;
    }
    h1 {
      color: #0d1b2a;
      border-bottom: 3px solid #d4af37;
      padding-bottom: 10px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 10px 20px;
      background: #e0e7ee;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      border: 1px solid #c0c8d0;
      border-bottom: none;
    }
    .tab.active {
      background: #0d1b2a;
      color: #d4af37;
      font-weight: bold;
    }
    .panel {
      background: white;
      border: 1px solid #c0c8d0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      display: none;
    }
    .panel.active { display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: right;
    }
    th {
      background: #0d1b2a;
      color: #d4af37;
    }
    tr:nth-child(even) { background: #f9fafb; }

    button {
      padding: 8px 16px;
      background: #0d1b2a;
      color: #d4af37;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin: 4px 2px;
    }
    button:hover { background: #1b263b; }
    button.danger { background: #c0392b; color: white; }

    input, select {
      padding: 8px;
      border: 1px solid #c0c8d0;
      border-radius: 4px;
      font-size: 14px;
      margin: 3px;
    }

    .form-row {
      margin: 10px 0;
    }
    .form-row label {
      display: inline-block;
      width: 130px;
      font-weight: bold;
    }

    .balance-low { color: #c0392b; font-weight: bold; }
    .balance-ok { color: #16a085; }
    .status-active { color: #27ae60; }
    .status-blocked { color: #c0392b; }

    .alert {
      background: #fff3cd;
      border: 1px solid #ffc107;
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
    }

    .new-code {
      background: #d4edda;
      border: 2px solid #28a745;
      padding: 15px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 16px;
      margin: 10px 0;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>ניהול מערכת תמלול תורה</h1>

  <div class="tabs">
    <div class="tab active" onclick="showTab('customers')">לקוחות</div>
    <div class="tab" onclick="showTab('add_customer')">הוספת לקוח</div>
    <div class="tab" onclick="showTab('reports')">דוחות</div>
    <div class="tab" onclick="showTab('keys')">מפתחות שרת</div>
  </div>

  <!-- ===== לקוחות ===== -->
  <div id="panel-customers" class="panel active">
    <h2>רשימת לקוחות</h2>
    <button onclick="loadCustomers()">🔄 רענן</button>
    <input type="text" id="search-customer" placeholder="חיפוש (שם / מייל / קוד)" oninput="filterCustomers()">
    <div id="customers-table">טוען...</div>
  </div>

  <!-- ===== הוספת לקוח ===== -->
  <div id="panel-add_customer" class="panel">
    <h2>הוספת לקוח חדש</h2>
    <div class="form-row">
      <label>שם:</label>
      <input type="text" id="new-name" />
    </div>
    <div class="form-row">
      <label>אימייל:</label>
      <input type="email" id="new-email" />
    </div>
    <div class="form-row">
      <label>טלפון:</label>
      <input type="tel" id="new-phone" />
    </div>
    <button onclick="createCustomerAction()">צור לקוח</button>
    <div id="new-customer-result"></div>
  </div>

  <!-- ===== דוחות ===== -->
  <div id="panel-reports" class="panel">
    <h2>דוח חודשי</h2>
    <div class="form-row">
      <label>שנה:</label>
      <input type="number" id="report-year" value="2026" />
      <label>חודש:</label>
      <input type="number" id="report-month" min="1" max="12" value="4" />
      <button onclick="loadReport()">הצג דוח</button>
    </div>
    <div id="report-result"></div>
  </div>

  <!-- ===== מפתחות שרת ===== -->
  <div id="panel-keys" class="panel">
    <h2>מפתחות API של השרת</h2>
    <p>המפתחות נשמרים ב-Script Properties (לא בקוד). הם משמשים לקריאות פרמיום.</p>
    <div id="keys-status">טוען...</div>

    <h3>עדכן מפתח</h3>
    <div class="form-row">
      <label>ספק:</label>
      <select id="key-provider">
        <option value="gemini">Gemini</option>
        <option value="claude">Claude</option>
        <option value="openai">OpenAI</option>
      </select>
    </div>
    <div class="form-row">
      <label>מפתח:</label>
      <input type="password" id="new-api-key" style="width:400px" />
    </div>
    <button onclick="saveServerKey()">שמור</button>
    <div id="key-save-result"></div>
  </div>


  <script>
    var allCustomers = [];

    function textValue(value) {
      return value == null ? '' : String(value);
    }

    function errorMessage(err) {
      if (err && err.message != null) return String(err.message);
      return err == null ? 'שגיאה לא ידועה' : String(err);
    }

    function clearNode(node) {
      while (node && node.firstChild) node.removeChild(node.firstChild);
    }

    function setText(id, value) {
      var node = document.getElementById(id);
      if (!node) return null;
      clearNode(node);
      node.textContent = textValue(value);
      return node;
    }

    function renderBox(id, className, value) {
      var host = document.getElementById(id);
      if (!host) return null;
      clearNode(host);
      var box = document.createElement('div');
      box.className = className;
      box.textContent = textValue(value);
      host.appendChild(box);
      return box;
    }

    function renderError(id, err) {
      return renderBox(id, 'alert', 'שגיאה: ' + errorMessage(err));
    }

    function appendCell(row, value, className) {
      var cell = document.createElement('td');
      if (className) cell.className = className;
      cell.textContent = textValue(value);
      row.appendChild(cell);
      return cell;
    }

    function appendHeader(row, value) {
      var cell = document.createElement('th');
      cell.textContent = textValue(value);
      row.appendChild(cell);
      return cell;
    }

    function appendActionButton(parent, label, className, handler) {
      var button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      if (className) button.className = className;
      button.addEventListener('click', handler);
      parent.appendChild(button);
      return button;
    }

    function numericMoney(value) {
      var n = parseInt(value || 0, 10);
      if (!Number.isFinite(n)) n = 0;
      return (n / 100).toFixed(2);
    }

    function showTab(tabName) {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
      if (typeof event !== 'undefined' && event && event.target) event.target.classList.add('active');
      var panel = document.getElementById('panel-' + tabName);
      if (panel) panel.classList.add('active');

      if (tabName === 'customers') loadCustomers();
      if (tabName === 'keys') loadKeys();
    }

    function loadCustomers() {
      setText('customers-table', 'טוען...');
      google.script.run
        .withSuccessHandler(function(customers) {
          allCustomers = Array.isArray(customers) ? customers : [];
          renderCustomersTable(allCustomers);
        })
        .withFailureHandler(function(err) {
          renderError('customers-table', err);
        })
        .admin_listCustomers();
    }

    function filterCustomers() {
      var q = document.getElementById('search-customer').value.toLowerCase();
      var filtered = allCustomers.filter(function(c) {
        return (c.name && c.name.toString().toLowerCase().indexOf(q) >= 0) ||
               (c.email && c.email.toString().toLowerCase().indexOf(q) >= 0) ||
               (c.access_code && c.access_code.toString().toLowerCase().indexOf(q) >= 0);
      });
      renderCustomersTable(filtered);
    }

    function renderCustomersTable(customers) {
      var host = document.getElementById('customers-table');
      clearNode(host);
      if (!customers || customers.length === 0) {
        var empty = document.createElement('p');
        empty.textContent = 'אין לקוחות עדיין.';
        host.appendChild(empty);
        return;
      }

      var table = document.createElement('table');
      var thead = document.createElement('thead');
      var headerRow = document.createElement('tr');
      ['ID', 'שם', 'מייל', 'סטטוס', 'יתרה (ש"ח)', 'נצרך (ש"ח)', 'פעולות']
        .forEach(function(label) { appendHeader(headerRow, label); });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      var tbody = document.createElement('tbody');
      customers.forEach(function(customer) {
        var c = customer || {};
        var customerId = textValue(c.customer_id);
        var currentStatus = textValue(c.status);
        var balanceAgorot = parseInt(c.balance_agorot || 0, 10);
        if (!Number.isFinite(balanceAgorot)) balanceAgorot = 0;
        var balanceClass = balanceAgorot < 1000 ? 'balance-low' : 'balance-ok';
        var statusClass = currentStatus === 'active' ? 'status-active' : 'status-blocked';

        var row = document.createElement('tr');
        appendCell(row, customerId);
        appendCell(row, c.name);
        appendCell(row, c.email);
        appendCell(row, currentStatus, statusClass);
        appendCell(row, numericMoney(c.balance_agorot), balanceClass);
        appendCell(row, numericMoney(c.total_used_agorot));

        var actions = document.createElement('td');
        appendActionButton(actions, '+ נקודות', '', function() {
          addPointsAction(customerId);
        });
        appendActionButton(
          actions,
          currentStatus === 'active' ? 'חסום' : 'שחרר',
          'danger',
          function() { toggleStatus(customerId, currentStatus); }
        );
        appendActionButton(actions, 'קוד חדש', '', function() {
          regenerateCode(customerId);
        });
        row.appendChild(actions);
        tbody.appendChild(row);
      });

      table.appendChild(tbody);
      host.appendChild(table);
    }

    function createCustomerAction() {
      var name = document.getElementById('new-name').value;
      var email = document.getElementById('new-email').value;
      var phone = document.getElementById('new-phone').value;
      if (!name) { alert('שם נדרש'); return; }

      google.script.run
        .withSuccessHandler(function(result) {
          var host = document.getElementById('new-customer-result');
          clearNode(host);
          var box = document.createElement('div');
          box.className = 'new-code';
          box.appendChild(document.createTextNode('לקוח נוצר! זה הקוד האישי - העתק עכשיו!'));
          box.appendChild(document.createElement('br'));
          var strong = document.createElement('strong');
          strong.textContent = textValue(result && result.access_code);
          box.appendChild(strong);
          box.appendChild(document.createElement('br'));
          box.appendChild(document.createTextNode('הקוד לא יוצג שוב!'));
          host.appendChild(box);

          document.getElementById('new-name').value = '';
          document.getElementById('new-email').value = '';
          document.getElementById('new-phone').value = '';
        })
        .withFailureHandler(function(err) {
          renderError('new-customer-result', err);
        })
        .admin_addCustomer(name, email, phone);
    }

    function addPointsAction(customerId) {
      var shekels = prompt('כמה שקלים להוסיף?');
      if (!shekels) return;
      var note = prompt('הערה (אופציונלי):') || '';

      google.script.run
        .withSuccessHandler(function() { alert('נוסף בהצלחה'); loadCustomers(); })
        .withFailureHandler(function(err) { alert('שגיאה: ' + errorMessage(err)); })
        .admin_addPoints(customerId, shekels, note);
    }

    function toggleStatus(customerId, currentStatus) {
      var newStatus = currentStatus === 'active' ? 'blocked' : 'active';
      if (!confirm('לשנות סטטוס ל-' + newStatus + '?')) return;
      google.script.run
        .withSuccessHandler(function() { loadCustomers(); })
        .withFailureHandler(function(err) { alert('שגיאה: ' + errorMessage(err)); })
        .admin_setStatus(customerId, newStatus);
    }

    function regenerateCode(customerId) {
      if (!confirm('ליצור קוד חדש? (הקוד הישן לא יעבוד יותר)')) return;
      google.script.run
        .withSuccessHandler(function(result) {
          alert(
            'קוד חדש: ' + textValue(result && result.new_access_code) +
            '\n\nשמור אותו - הוא לא יוצג שוב!'
          );
          loadCustomers();
        })
        .withFailureHandler(function(err) { alert('שגיאה: ' + errorMessage(err)); })
        .admin_regenerateCode(customerId);
    }

    function appendReportRow(table, label, value, emphasize) {
      var row = document.createElement('tr');
      appendHeader(row, label);
      var cell = document.createElement('td');
      if (emphasize) {
        var strong = document.createElement('strong');
        strong.textContent = textValue(value);
        cell.appendChild(strong);
      } else {
        cell.textContent = textValue(value);
      }
      row.appendChild(cell);
      table.appendChild(row);
    }

    function loadReport() {
      var year = parseInt(document.getElementById('report-year').value, 10);
      var month = parseInt(document.getElementById('report-month').value, 10);
      setText('report-result', 'טוען...');

      google.script.run
        .withSuccessHandler(function(reportValue) {
          var report = reportValue || {};
          var host = document.getElementById('report-result');
          clearNode(host);

          var summary = document.createElement('table');
          appendReportRow(summary, 'קריאות', report.calls_count);
          appendReportRow(summary, 'הכנסות', textValue(report.total_revenue_shekels) + ' ש"ח');
          appendReportRow(summary, 'הוצאות (בינה)', textValue(report.total_cost_shekels) + ' ש"ח');
          appendReportRow(summary, 'רווח', textValue(report.profit_shekels) + ' ש"ח', true);
          host.appendChild(summary);

          if (Array.isArray(report.top_customers) && report.top_customers.length > 0) {
            var heading = document.createElement('h3');
            heading.textContent = '10 הלקוחות הכי פעילים';
            host.appendChild(heading);

            var table = document.createElement('table');
            var thead = document.createElement('thead');
            var headRow = document.createElement('tr');
            ['ID', 'קריאות', 'הכנסה (ש"ח)']
              .forEach(function(label) { appendHeader(headRow, label); });
            thead.appendChild(headRow);
            table.appendChild(thead);

            var tbody = document.createElement('tbody');
            report.top_customers.forEach(function(item) {
              var tc = item || {};
              var row = document.createElement('tr');
              appendCell(row, tc.customer_id);
              appendCell(row, tc.calls);
              appendCell(row, numericMoney(tc.revenue_agorot));
              tbody.appendChild(row);
            });
            table.appendChild(tbody);
            host.appendChild(table);
          }
        })
        .withFailureHandler(function(err) {
          renderError('report-result', err);
        })
        .admin_getMonthlyReport(year, month);
    }

    function loadKeys() {
      google.script.run
        .withSuccessHandler(function(statusValue) {
          var status = statusValue || {};
          var host = document.getElementById('keys-status');
          clearNode(host);
          var table = document.createElement('table');
          [
            ['Gemini', !!status.has_gemini],
            ['Claude', !!status.has_claude],
            ['OpenAI', !!status.has_openai]
          ].forEach(function(item) {
            var row = document.createElement('tr');
            appendHeader(row, item[0]);
            appendCell(row, item[1] ? '✓ מוגדר' : '✗ חסר');
            table.appendChild(row);
          });
          host.appendChild(table);
        })
        .withFailureHandler(function(err) {
          renderError('keys-status', err);
        })
        .admin_getServerKeys();
    }

    function saveServerKey() {
      var provider = document.getElementById('key-provider').value;
      var apiKey = document.getElementById('new-api-key').value;
      if (!apiKey) { alert('הזן מפתח'); return; }

      google.script.run
        .withSuccessHandler(function() {
          renderBox('key-save-result', 'new-code', 'המפתח נשמר בהצלחה');
          document.getElementById('new-api-key').value = '';
          loadKeys();
        })
        .withFailureHandler(function(err) {
          renderError('key-save-result', err);
        })
        .admin_setServerKey(provider, apiKey);
    }

    // טעינה ראשונית
    loadCustomers();
  </script>
</body>
</html>
