name: V9 reviewed integration bootstrap

on:
  push:
    branches: [fix/v9-unified-opening-layout]
    paths: ['.github/workflows/v9-inline-bootstrap.yml']

permissions:
  contents: read

jobs:
  integrate-and-test:
    if: github.repository == '7155401-eng/unified-text-editor' && github.ref == 'refs/heads/fix/v9-unified-opening-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply reviewed edits only after verifying all inputs and outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          root = pathlib.Path.cwd()
          staging = root / 'scripts/v9-unified/staging'
          payload = ''.join((staging / f'{i:02d}.b64').read_text().strip() for i in range(14))
          compressed = base64.b64decode(payload, validate=True)
          expected = '9544ad95704a920426100deda00bf77f762e53224c29ae2ab65c87f19709d8cb'
          assert hashlib.sha256(compressed).hexdigest() == expected, 'Transfer checksum mismatch; no source files changed'
          manifest = json.loads(gzip.decompress(compressed))
          allowed = set('''scripts/apply_v9_continuation_opening_word_guard.mjs
          scripts/v9-unified/run-browser.mjs
          src/engine/v9_main_inline_layout.js
          src/engine/v9_opening_words_from_metadata.js
          src/engine/v9_source_fragments.js
          src/engine/v9_stretch_policy.js
          src/engine/v9_text_measurement.js
          src/opening_word.js
          src/vilna_v9.js
          src/vilna_v9_apply.js
          tests/v9-unified/browser-fixture.html
          tests/v9-unified/browser-suite.js
          tests/v9-unified/unit.test.mjs'''.splitlines())
          assert manifest['version'] == 1
          files = manifest['files']
          assert len(files) == len(allowed) and {x['path'] for x in files} == allowed
          outputs = {}
          for entry in files:
              path = root / entry['path']
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              old = path.read_bytes() if path.exists() else b''
              if entry['before'] is None:
                  assert not path.exists(), f'New path already exists: {entry["path"]}'
              else:
                  assert hashlib.sha256(old).hexdigest() == entry['before'], f'Base file changed: {entry["path"]}'
              lines = old.decode('utf-8').splitlines(keepends=True)
              prior = 0
              for edit in entry['edits']:
                  assert prior <= edit['start'] <= edit['end'] <= len(lines)
                  prior = edit['end']
              for edit in reversed(entry['edits']):
                  lines[edit['start']:edit['end']] = edit['text'].splitlines(keepends=True)
              out = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(out).hexdigest() == entry['after'], f'Output mismatch: {entry["path"]}'
              outputs[path] = out
          for path, data in outputs.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          (root / 'test-results/v9-unified').mkdir(parents=True, exist_ok=True)
          (root / 'test-results/v9-unified/verified-files.json').write_text(json.dumps({e['path']:e['after'] for e in files}, indent=2))
          print(f'Verified and applied {len(outputs)} source/test files; main branch untouched.')
          PY
          node --check src/vilna_v9.js
          node --check src/vilna_v9_apply.js
          node --test tests/v9-unified/*.test.mjs | tee test-results/v9-unified/unit.tap
      - name: Commit exact reviewed files on feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/v9-unified-opening-layout
          git fetch origin refs/heads/fix/v9-unified-opening-layout
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json, subprocess
          paths = list(json.load(open('test-results/v9-unified/verified-files.json')))
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git rm -r -- scripts/v9-unified/staging
          git rm -- .github/workflows/v9-inline-bootstrap.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(v9): own opening layout and preserve rich source fragments'
          git push origin HEAD:refs/heads/fix/v9-unified-opening-layout
          git rev-parse HEAD | tee test-results/v9-unified/commit.txt
      - name: Install locked dependencies without source-rewriting hooks
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser layout and pagination regression suite
        run: node scripts/v9-unified/run-browser.mjs
      - name: Build and verify no source rewriting
        shell: bash
        run: |
          set -euo pipefail
          npm run postinstall
          npm run build
          git diff --exit-code -- src scripts
          node --test tests/v9-unified/*.test.mjs | tee test-results/v9-unified/unit-after-build.tap
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-integration-validation-${{ github.run_id }}
          path: test-results/v9-unified/
          retention-days: 7
          if-no-files-found: warn
