name: Fixed-side footer level integration
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/v9-unified/**', 'scripts/v9-unified/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['src/main.js', 'src/vilna_v9.js', 'src/vilna_v9_apply.js', 'src/engine/v9_footer_grouping.js', 'tests/v9-unified/fixed-side-footer-level*', 'scripts/v9-unified/verify-fixed-side-footer-level.mjs', '.github/workflows/v9-fixed-side-footer-level.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-side-footer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: New grouping and unchanged earlier mixed-layout contracts
        run: node --test tests/v9-unified/fixed-side-footer-level.test.mjs tests/v9-unified/ref-no-break-mixed-mishna.test.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Immutable pre-fix baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ab24421e44262a9f52791a900598cfa7eb9879fc
          path: .paired-level-baseline
          persist-credentials: false
      - name: Original checkbox, unchanged layouts, multi-page ownership
        run: |
          node scripts/v9-unified/verify-fixed-side-footer-level.mjs
          cp test-results/fixed-side-footer-level/report.json test-results/fixed-side-footer-level/before-build.json
          git rev-parse HEAD HEAD^{tree} > test-results/fixed-side-footer-level/tested-commit.txt
      - name: Two builds without source or test rewrites
        run: |
          git diff --exit-code -- index.html src worker cloudflare scripts tests .github/workflows vite.config.js package.json package-lock.json
          npm run build
          git diff --exit-code -- index.html src worker cloudflare scripts tests .github/workflows vite.config.js package.json package-lock.json
          npm run build
          git diff --exit-code -- index.html src worker cloudflare scripts tests .github/workflows vite.config.js package.json package-lock.json
      - name: Repeat all checks after builds
        run: |
          node --test tests/v9-unified/fixed-side-footer-level.test.mjs tests/v9-unified/ref-no-break-mixed-mishna.test.mjs
          node scripts/v9-unified/verify-fixed-side-footer-level.mjs
      - name: Keep reports and source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-side-footer-level-${{ github.run_id }}
          path: test-results/fixed-side-footer-level/
          retention-days: 7
          if-no-files-found: warn
