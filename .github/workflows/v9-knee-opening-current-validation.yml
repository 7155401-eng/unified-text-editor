name: Temporary V9 knee opening current validation

on:
  push:
    branches:
      - fix/v9-knee-opening-grid-current-20261002

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: V9 unit regressions
        run: node --test tests/v9-unified/*.test.mjs
      - name: Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser V9 regressions
        run: node scripts/v9-unified/run-browser.mjs
      - name: Opening-window matrix
        run: node scripts/v9-unified/verify-opening-window-retry.mjs
      - name: Split-crown and knee matrix
        run: node scripts/v9-unified/verify-split-crown.mjs
