name: Temporary DOCX to renderer BiDi E2E

on:
  push:
    branches:
      - test/docx-to-renderer-bidi-e2e-20261001

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Word extractor regressions
        run: node --test tests/word-extractor/*.test.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: DOCX to renderer BiDi E2E
        run: node scripts/verify-docx-to-renderer-bidi-e2e.mjs
      - name: Regular renderer BiDi
        run: node scripts/verify-regular-renderer-bidi.mjs
      - name: V9 browser regressions
        run: node scripts/v9-unified/run-browser.mjs
      - name: Build
        run: npm run build
      - name: Repeat BiDi E2E after build
        run: node scripts/verify-docx-to-renderer-bidi-e2e.mjs
