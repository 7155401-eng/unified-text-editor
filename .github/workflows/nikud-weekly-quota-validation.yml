name: Temporary nikud weekly quota validation

on:
  push:
    branches:
      - feat/nikud-merger-weekly-success-quota-20260930

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22' }
      - name: Quota tests and syntax
        run: |
          node --check worker/tool_quota.js
          node --check worker/tool_gate.js
          node --check worker/nikud_merger.js
          node --check worker/index.js
          node --check src/premium/daily_quota_gate.js
          node --check src/nikud_merger/nikud_client_engine.js
          node --test tests/quota/*.test.mjs
      - name: Locked install and full build
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Quota tests after build
        run: node --test tests/quota/*.test.mjs
