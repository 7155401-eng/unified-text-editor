name: Temporary latest-main V9 geometry stack validation

on:
  push:
    branches:
      - validate/v9-geometry-stack-20260930

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: V9 unit/source regressions
        run: node --test tests/v9-unified/*.test.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: V9 browser regressions before build
        run: node scripts/v9-unified/run-browser.mjs
      - name: Cross-bot contracts
        run: |
          if [ -d tests/cross-bot ]; then node --test tests/cross-bot/*.test.mjs; fi
      - name: Full build
        run: npm run build
      - name: V9 regressions after build
        run: |
          node --test tests/v9-unified/*.test.mjs
          node scripts/v9-unified/run-browser.mjs
