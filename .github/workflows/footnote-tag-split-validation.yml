name: Temporary footnote tag split validation

on:
  push:
    branches:
      - feat/docx-footnote-split-by-tag-20260930

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check cloudflare/docx_split_footnotes_by_tag.js
          node --check cloudflare/docx_worker_entry.js
          node --check src/docx_tools/split_footnotes_by_tag.js
          node --check worker/index.js
      - name: Tag splitter tests
        run: node --test tests/docx/footnotes-by-tag.test.mjs
      - name: Existing DOCX converter regression
        run: node --test tests/docx/footnotes-to-curly.test.mjs
      - name: Full build
        run: npm run build
      - name: Tag splitter tests after build
        run: node --test tests/docx/footnotes-by-tag.test.mjs
