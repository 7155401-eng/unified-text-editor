name: Runtime normalizeEditorMark hotfix
on:
  push:
    branches: [fix/runtime-normalizeEditorMark-import]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: normalize-editor-mark-hotfix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Static runtime invariant
        run: |
          node --check src/engine_bridge.js
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('src/engine_bridge.js','utf8');
          if (!s.includes("editorMarksToRunMarks, normalizeEditorMark")) throw new Error('normalizeEditorMark is used but not imported');
          const refs=(s.match(/normalizeEditorMark\(/g)||[]).length;
          if (refs < 1) throw new Error('expected normalizeEditorMark call missing');
          console.log({normalizeEditorMarkCalls:refs});
          NODE
          node --test tests/v9-unified/*.test.mjs
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Production build
        run: |
          cp src/engine_bridge.js /tmp/engine_bridge.js
          npm run postinstall
          npm run build
          cmp /tmp/engine_bridge.js src/engine_bridge.js
