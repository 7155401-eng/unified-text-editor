name: Temporary V9 effective-fill v2 validation

on:
  push:
    branches:
      - fix/v9-effective-fill-guard-v2-20260930

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22' }
      - name: Unit
        run: |
          node --check src/engine/v9_split_policy.js
          node --test tests/v9-unified/*.test.mjs
      - name: Dependencies
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
        run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Browser before build
        run: node scripts/v9-unified/run-browser.mjs
      - name: Build
        run: |
          npm run postinstall
          npm run build
      - name: After build
        run: |
          node --test tests/v9-unified/*.test.mjs
          node scripts/v9-unified/run-browser.mjs
