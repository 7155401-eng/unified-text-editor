name: Current-main remaining acceptance audit

on:
  push:
    branches: [gpt56sol-main-acceptance-20261004-a403]
    paths: ['.github/workflows/temp-current-main-remaining-acceptance.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: current-main-remaining-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-main-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pin this audit to the current main snapshot
        shell: bash
        run: |
          set -euo pipefail
          expected='a403460a5b28511ebc163e584ee5f8f23bc064a8'
          actual="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a403460a5b28511ebc163e584ee5f8f23bc064a8
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts

      - name: Targeted page-tail, source and PDF contracts
        run: |
          mkdir -p test-results/current-main-acceptance
          node --test             tests/v9-unified/tail-fallback-justification.test.mjs             tests/v9-unified/exact-tail-partition.test.mjs             tests/v9-unified/main-bottom-gap-planning.test.mjs             tests/v9-unified/opening-tail-source.test.mjs             tests/v9-unified/lazy-pdf-export.test.mjs             tests/v9-unified/lazy-debug-export.test.mjs             | tee test-results/current-main-acceptance/targeted.tap

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Current-main browser regressions
        run: |
          node scripts/v9-unified/run-browser.mjs             | tee test-results/current-main-acceptance/browser.log
          cp test-results/v9-unified/browser.json test-results/current-main-acceptance/browser.json

      - name: Exact current-main PDF recovery and stable chunk
        run: |
          node scripts/pdf-export/verify-load-recovery.mjs             | tee test-results/current-main-acceptance/pdf-recovery.log
          cp -R test-results/pdf-load-recovery/. test-results/current-main-acceptance/pdf-recovery/
          npm run build | tee test-results/current-main-acceptance/build.log
          node scripts/pdf-export/verify-stable-chunk.mjs a403-current-main             | tee test-results/current-main-acceptance/pdf-stable-chunk.log
          cp test-results/pdf-load-recovery/stable-chunk-a403-current-main.json              test-results/current-main-acceptance/

      - name: Live browser imports stable module and downloads a real PDF
        shell: bash
        run: |
          cat > live-current-main-pdf.mjs <<'EOF'
          import { chromium } from 'playwright-chromium';
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const out='test-results/current-main-acceptance/live-pdf';
          fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            acceptDownloads:true,
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36',
            extraHTTPHeaders:{'accept-language':'he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7'}
          });
          const page=await context.newPage();
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));

          const root=await page.goto('https://app.ravtext.com/',{
            waitUntil:'domcontentloaded',timeout:45000
          });
          const moduleProbe=await page.evaluate(async()=>{
            const url='/assets/pdf_export.js?audit='+Date.now();
            const response=await fetch(url,{cache:'no-store'});
            const body=await response.clone().arrayBuffer();
            let imported=false, exportType='', importError='';
            try{
              const mod=await import(url);
              imported=true;
              exportType=typeof mod.downloadPagesAsPdf;
            }catch(e){importError=String(e)}
            return {
              url,status:response.status,
              contentType:response.headers.get('content-type')||'',
              bytes:body.byteLength,imported,exportType,importError
            };
          });

          await page.evaluate(()=>{
            const old=document.querySelector('#gpt-current-main-pdf-probe');
            old?.remove();
            const style=document.createElement('style');
            style.id='gpt-current-main-pdf-probe-style';
            style.textContent='.pages-container{display:block}.page{width:380px;height:537px;padding:24px;box-sizing:border-box;background:white;color:#222;direction:rtl;font:22px/1.55 serif}.page p{margin:0}';
            document.head.append(style);
            const host=document.createElement('div');
            host.id='gpt-current-main-pdf-probe';
            host.className='pages-container';
            const p=document.createElement('section');
            p.className='page v9-page';
            p.innerHTML='<p>בדיקת PDF חיה — current main</p><p>אב גד הוז חטי כלמ נסע פצק.</p>';
            host.append(p);
            document.body.append(host);
          });

          const [download,result]=await Promise.all([
            page.waitForEvent('download',{timeout:90000}),
            page.evaluate(async()=>{
              const mod=await import('/assets/pdf_export.js?full='+Date.now());
              return await mod.downloadPagesAsPdf(
                document.querySelector('#gpt-current-main-pdf-probe'),
                {filename:'current-main-live-probe.pdf',includeBackgrounds:false}
              );
            })
          ]);
          const path=await download.path();
          if(!path) throw new Error('browser did not expose downloaded PDF path');
          const bytes=fs.readFileSync(path);
          fs.writeFileSync(out+'/current-main-live-probe.pdf',bytes);
          const ascii=bytes.subarray(0,16).toString('latin1');
          const pageCount=(bytes.toString('latin1').match(/\/Type\s*\/Page(?!s)/g)||[]).length;
          const report={
            rootStatus:root?.status()||0,
            finalUrl:page.url(),
            pageErrors,moduleProbe,
            exportResult:result,
            suggestedFilename:download.suggestedFilename(),
            pdfBytes:bytes.length,
            pdfSha256:crypto.createHash('sha256').update(bytes).digest('hex'),
            pdfHeader:ascii,
            pdfPageObjects:pageCount
          };
          fs.writeFileSync(out+'/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));

          if(report.rootStatus!==200) throw new Error('live app root HTTP '+report.rootStatus);
          if(pageErrors.length) throw new Error('live page errors: '+JSON.stringify(pageErrors));
          if(moduleProbe.status!==200 || !/javascript|ecmascript/i.test(moduleProbe.contentType))
            throw new Error('stable live module response invalid: '+JSON.stringify(moduleProbe));
          if(!moduleProbe.imported || moduleProbe.exportType!=='function')
            throw new Error('stable live module did not import: '+moduleProbe.importError);
          if(result?.fallback) throw new Error('live exporter fell back instead of downloading');
          if(bytes.length<1000 || !ascii.startsWith('%PDF-'))
            throw new Error('download is not a real PDF');
          if(pageCount<2) throw new Error('expected cover + at least one content page');
          await browser.close();
          EOF
          node live-current-main-pdf.mjs

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-main-remaining-acceptance-${{ github.run_id }}
          path: test-results/current-main-acceptance/
          retention-days: 7
          if-no-files-found: error

  repository-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pin this audit to the current main snapshot
        shell: bash
        run: |
          set -euo pipefail
          expected='a403460a5b28511ebc163e584ee5f8f23bc064a8'
          actual="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a403460a5b28511ebc163e584ee5f8f23bc064a8
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch live branch refs read-only
        run: git fetch --no-tags --force origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Reclassify every live branch against current main
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_BRANCH: gpt56sol-main-acceptance-20261004-a403
        run: |
          mkdir -p test-results/repository-audit
          python3 - <<'PY'
          import collections, datetime as dt, json, os, subprocess
          from pathlib import Path
          OUT=Path('test-results/repository-audit')
          MAIN='origin/main'
          AUDIT='origin/'+os.environ['AUDIT_BRANCH']
          def run(*args,check=True):
            p=subprocess.run(args,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
            if check and p.returncode: raise RuntimeError(' '.join(args)+': '+p.stderr.strip())
            return p
          main_sha=run('git','rev-parse',MAIN).stdout.strip()
          refs=[x.strip() for x in run('git','for-each-ref','--format=%(refname:short)','refs/remotes/origin/').stdout.splitlines()
                if x.strip() not in {'origin/HEAD',MAIN,AUDIT}]
          now=dt.datetime.now(dt.timezone.utc); rows=[]; tips=collections.defaultdict(list)
          for ref in refs:
            name=ref.removeprefix('origin/')
            tip=run('git','rev-parse',ref).stdout.strip(); tips[tip].append(name)
            behind,ahead=map(int,run('git','rev-list','--left-right','--count',f'{MAIN}...{ref}').stdout.split())
            merged=run('git','merge-base','--is-ancestor',ref,MAIN,check=False).returncode==0
            main_ancestor=run('git','merge-base','--is-ancestor',MAIN,ref,check=False).returncode==0
            cherry=run('git','cherry',MAIN,ref,check=False).stdout.splitlines()
            unique=sum(1 for x in cherry if x.startswith('+ '))
            equivalent=sum(1 for x in cherry if x.startswith('- '))
            iso=run('git','show','-s','--format=%cI',tip).stdout.strip()
            subject=run('git','show','-s','--format=%s',tip).stdout.strip()
            try:
              changed=dt.datetime.fromisoformat(iso.replace('Z','+00:00'))
              age=(now-changed).total_seconds()/86400
            except Exception: age=None
            if merged: status='fully-merged-ancestor'
            elif ahead==0: status='no-ahead-commits'
            elif unique==0: status='patch-equivalent-only'
            elif main_ancestor: status='ahead-unique'
            else: status='diverged-unique'
            base=run('git','merge-base',MAIN,ref,check=False).stdout.strip()
            files=[]
            if base and unique:
              files=[x for x in run('git','diff','--name-only',f'{base}..{ref}',check=False).stdout.splitlines() if x.strip()]
            rows.append(dict(branch=name,tip=tip,status=status,ahead=ahead,behind=behind,
              patch_unique=unique,patch_equivalent=equivalent,commit_date=iso,
              age_days=None if age is None else round(age,2),recent_7d=bool(age is not None and age<=7),
              subject=subject,changed_files=files,changed_file_count=len(files)))
          counts=collections.Counter(r['status'] for r in rows)
          unique=[r for r in rows if r['patch_unique']>0]
          report={
            'main_sha':main_sha,'branch_count':len(rows),'status_counts':dict(sorted(counts.items())),
            'unique_patch_branch_count':len(unique),
            'recent_unique_patch_branch_count':sum(r['recent_7d'] for r in unique),
            'historical_unique_patch_branch_count':sum(not r['recent_7d'] for r in unique),
            'duplicate_tip_groups':{sha:names for sha,names in tips.items() if len(names)>1},
            'branches':sorted(rows,key=lambda r:(r['status'],r['branch']))
          }
          (OUT/'branches.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k not in {'branches','duplicate_tip_groups'}},indent=2))
          PY

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?status=failure&per_page=100"             > test-results/repository-audit/failed-run-pages.json

          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          OUT=Path('test-results/repository-audit')
          pages=json.loads((OUT/'failed-run-pages.json').read_text())
          runs=[r for p in pages for r in p.get('workflow_runs',[])]
          def git(*args): return subprocess.run(args,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          live={x.strip().removeprefix('origin/'):x.strip()
                for x in git('git','for-each-ref','--format=%(refname:short)','refs/remotes/origin/').stdout.splitlines()
                if x.strip().startswith('origin/') and x.strip()!='origin/HEAD'}
          out=[]
          for r in runs:
            sha=r.get('head_sha') or ''; branch=r.get('head_branch') or ''
            reachable=bool(sha) and git('git','cat-file','-e',f'{sha}^{{commit}}').returncode==0
            ancestor=reachable and git('git','merge-base','--is-ancestor',sha,'origin/main').returncode==0
            ref=live.get(branch); superseded=False
            if ref and reachable: superseded=git('git','rev-parse',ref).stdout.strip()!=sha
            if ancestor: cls='failed-commit-now-in-main-history'
            elif ref and superseded: cls='superseded-on-live-branch'
            elif ref: cls='failure-at-current-live-branch-tip'
            elif reachable: cls='unmerged-reachable-historical'
            else: cls='deleted-or-unreachable-historical'
            out.append({'id':r.get('id'),'workflow':r.get('name'),'head_branch':branch,'head_sha':sha,
                        'created_at':r.get('created_at'),'html_url':r.get('html_url'),'classification':cls})
          counts={}
          for r in out: counts[r['classification']]=counts.get(r['classification'],0)+1
          payload={'count':len(out),'classification_counts':counts,
                   'current_tip_failures':[r for r in out if r['classification']=='failure-at-current-live-branch-tip']}
          (OUT/'failed-workflows.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          print(json.dumps({'count':len(out),'classification_counts':counts,
                            'current_tip_failure_count':len(payload['current_tip_failures'])},indent=2))
          PY

      - name: Upload repository audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-main-repository-audit-${{ github.run_id }}
          path: test-results/repository-audit/
          retention-days: 7
          if-no-files-found: error
