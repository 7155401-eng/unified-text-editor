name: Validate and commit exact V9 candidate once
on:
  push:
    branches: [fix/v9-typography-spacing-regressions]
    paths: ['.github/workflows/v9-apply-candidate-once.yml']
permissions:
  contents: write
concurrency:
  group: v9-candidate-once
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  candidate:
    if: github.ref == 'refs/heads/fix/v9-typography-spacing-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply only exact prevalidated source edits
        run: |
          mkdir -p test-results/v9-unified
          python3 - <<'PY'
          from pathlib import Path
          import json, gzip, base64, hashlib
          encoded = ''.join(Path(f'.github/v9-candidate-edits-{i}.b64').read_text().strip() for i in [1,2,3])
          # Repair one identified transcription character; the full payload and
          # every input/output source file must still match the pinned hashes.
          encoded = encoded.replace('GJZ karhi', 'GJZ' + chr(105) + 'karhi')
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'e978ea83f737356a7badf083af47aa2b915256011c69cbc0751974e13107714e'
          edits = json.loads(raw)
          outputs = []
          for item in edits:
              p = Path(item['path'])
              assert p.parts[0] in ('src','tests') and '..' not in p.parts and not p.is_absolute()
              assert not p.is_symlink()
              if item['before'] is None:
                  assert not p.exists(), f'New path already exists: {p}'
                  original = ''
              else:
                  data = p.read_bytes()
                  assert hashlib.sha256(data).hexdigest() == item['before'], f'Source changed: {p}'
                  original = data.decode('utf-8')
              last = 0
              for a,b,new in item['edits']:
                  assert isinstance(a,int) and isinstance(b,int) and last <= a <= b <= len(original)
                  last = b
              result = original
              for a,b,new in reversed(item['edits']):
                  result = result[:a] + new + result[b:]
              data = result.encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == item['after'], f'Output mismatch: {p}'
              outputs.append((p,data))
          for p,data in outputs:
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(data)
          Path('test-results/v9-unified/source-hashes.json').write_text(json.dumps([{k:v for k,v in e.items() if k!='edits'} for e in edits],indent=2))
          print(f'Verified and applied {len(outputs)} source files; no document or font files included.')
          PY
          git rm .github/v9-candidate-edits-*.b64 .github/workflows/v9-apply-candidate-once.yml
          git add src tests
          git diff --cached --check
          git config user.name 'RavText validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v9): share styled stream layout, preserve source and keep note anchors with text'
          git rev-parse HEAD | tee test-results/v9-unified/commit.txt
      - name: Unit tests before build
        run: |
          node --check src/vilna_v9.js
          node --check src/engine_bridge.js
          node --test tests/v9-unified/*.test.mjs | tee test-results/v9-unified/unit.tap
      - name: Locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser regressions before build
        run: node scripts/v9-unified/run-browser.mjs
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 82936b7ba1720714f6ae73bda95e9791f6873856
          path: .v9-baseline
          persist-credentials: false
      - name: Build exact unmodified baseline
        run: |
          cmp package-lock.json .v9-baseline/package-lock.json
          ln -s "$GITHUB_WORKSPACE/node_modules" .v9-baseline/node_modules
          (cd .v9-baseline; npm run postinstall && npm run build) 2>&1 | tee test-results/v9-unified/baseline-build.log
      - name: Full build, source integrity, and repeated regressions
        run: |
          npm run postinstall 2>&1 | tee test-results/v9-unified/postinstall.log
          npm run build 2>&1 | tee test-results/v9-unified/build.log
          node scripts/v9-unified/verify-build-sources.mjs .v9-baseline
          node --test tests/v9-unified/*.test.mjs | tee test-results/v9-unified/unit-after-build.tap
          cp test-results/v9-unified/browser.json test-results/v9-unified/browser-before-build.json
          node scripts/v9-unified/run-browser.mjs
      - name: Publish verified candidate to feature branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/fix/v9-typography-spacing-regressions'
          git push origin HEAD:refs/heads/fix/v9-typography-spacing-regressions
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-candidate-${{ github.run_id }}
          path: test-results/v9-unified/
          retention-days: 7
