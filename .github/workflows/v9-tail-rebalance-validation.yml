name: Temporary V9 paragraph-tail validation

on:
  push:
    branches:
      - fix/v9-paragraph-tail-rebalance-20260930

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check src/engine/v9_main_inline_layout.js
          node --check src/vilna_v9.js
          node --check tests/v9-unified/spacing-regressions.test.mjs
      - name: V9 unit regressions before build
        run: node --test tests/v9-unified/*.test.mjs
      - name: Full build
        run: npm run build
      - name: V9 unit regressions after build
        run: node --test tests/v9-unified/*.test.mjs
