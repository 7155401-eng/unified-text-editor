name: Temporary Word bidi punctuation audit

on:
  push:
    branches:
      - audit/v9-bracket-raster-current-20261001

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Verify punctuation code points through DOCX import
        run: node --test tests/word-extractor/bidi-punctuation-roundtrip.test.mjs
