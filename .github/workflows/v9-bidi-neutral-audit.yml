name: Temporary neutral punctuation BiDi audit

on:
  push:
    branches:
      - audit/v9-bidi-neutral-punctuation-20261001

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: BiDi units
        run: node --test tests/v9-unified/bidi-controls.test.mjs
      - name: Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser
        run: node scripts/v9-unified/run-browser.mjs
