name: Temporary V9 opening-tail validation

on:
  push:
    branches:
      - fix/v9-tail-rebalance-includes-opening-20260930

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Unit regressions
        run: |
          mkdir -p test-results/v9-unified
          node --check src/engine/v9_main_inline_layout.js
          node --check src/vilna_v9.js
          node --test tests/v9-unified/*.test.mjs | tee test-results/v9-unified/unit.tap
      - name: Locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser regressions before build
        run: node scripts/v9-unified/run-browser.mjs
      - name: Fetch exact baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 82936b7ba1720714f6ae73bda95e9791f6873856
          path: .v9-baseline
          persist-credentials: false
      - name: Build baseline
        run: |
          cmp package-lock.json .v9-baseline/package-lock.json
          ln -s "$GITHUB_WORKSPACE/node_modules" .v9-baseline/node_modules
          (cd .v9-baseline; npm run postinstall && npm run build)
      - name: Full build and source rewrite integrity
        run: |
          npm run postinstall
          npm run build
          node scripts/v9-unified/verify-build-sources.mjs .v9-baseline
      - name: Regressions after build
        run: |
          node --test tests/v9-unified/*.test.mjs | tee test-results/v9-unified/unit-after-build.tap
          cp test-results/v9-unified/browser.json test-results/v9-unified/browser-before-build.json
          node scripts/v9-unified/run-browser.mjs
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-opening-tail-${{ github.run_id }}
          path: test-results/v9-unified/
          retention-days: 7
