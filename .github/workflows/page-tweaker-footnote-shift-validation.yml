name: Temporary Page Tweaker footnote-shift validation

on:
  push:
    branches:
      - feat/page-tweaker-footnote-shift-v2-20261001

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check src/page_tweaks.js
          node --check src/vilna_v9.js
          node --check src/layout_analysis_report.js
      - name: Unit and report regressions
        run: |
          node --test tests/v9-unified/page-tweaks.test.mjs
          node --test tests/integration/layout-analysis-report.test.mjs
          node --test tests/v9-unified/*.test.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: V9 browser regressions before build
        run: node scripts/v9-unified/run-browser.mjs
      - name: Source pristine before build
        run: |
          git diff --exit-code -- \
            src/page_tweaks.js \
            src/vilna_v9.js \
            src/layout_analysis_report.js \
            scripts/apply_v9_column_split_line_edge_guard_patch.mjs
      - name: Fetch current main baseline for build comparison
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: .v9-baseline
          persist-credentials: false
      - name: Build baseline with the same locked dependencies
        run: |
          cmp package-lock.json .v9-baseline/package-lock.json
          ln -s "$GITHUB_WORKSPACE/node_modules" .v9-baseline/node_modules
          (cd .v9-baseline; npm run postinstall --if-present && npm run build)
      - name: Build twice without rewriting planner sources
        run: |
          npm run postinstall --if-present
          npm run build
          node scripts/v9-unified/verify-build-sources.mjs .v9-baseline
          git diff --exit-code -- \
            src/page_tweaks.js \
            src/vilna_v9.js \
            src/layout_analysis_report.js \
            scripts/apply_v9_column_split_line_edge_guard_patch.mjs
          npm run build
          node scripts/v9-unified/verify-build-sources.mjs .v9-baseline
          git diff --exit-code -- \
            src/page_tweaks.js \
            src/vilna_v9.js \
            src/layout_analysis_report.js \
            scripts/apply_v9_column_split_line_edge_guard_patch.mjs
      - name: Regressions after build
        run: |
          node --test tests/v9-unified/page-tweaks.test.mjs
          node --test tests/integration/layout-analysis-report.test.mjs
          node scripts/v9-unified/run-browser.mjs
