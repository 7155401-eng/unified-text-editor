name: Apply verified PDF recovery delta
on:
  push:
    branches: [fix/pdf-module-load-recovery-20261001]
    paths: [.github/workflows/materialize-pdf-recovery.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == '7155401-eng/unified-text-editor' && github.ref == 'refs/heads/fix/pdf-module-load-recovery-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: 7643397724c49b87108b7ac0017c2f61ae4fbcbe
      TARGET: fix/pdf-module-load-recovery-20261001
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify immutable baseline and exact product change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git hash-object src/engine_toolbar.js)" = 9acfaf0c027761cdd0233b2f4c0e6af8dbe429f7
          printf '%s\n' '0f3498b96dca57cb7cba61953c3df93ebf6b201b2fd803c8b0714309f1aacc49  .github/patches/pdf-load-recovery.patch' | sha256sum -c -
          cp .github/patches/pdf-load-recovery.patch /tmp/pdf-load-recovery.patch
          git rm .github/patches/pdf-load-recovery.patch .github/workflows/materialize-pdf-recovery.yml
          git apply --index --check /tmp/pdf-load-recovery.patch
          git apply --index /tmp/pdf-load-recovery.patch
          test "$(git hash-object src/engine_toolbar.js)" = e470b006197b4120652091f91255f93dda6ba2eb
          git diff --cached --check
          node --check src/engine_toolbar.js
          node --check scripts/pdf-export/verify-load-recovery.mjs
          node --test tests/v9-unified/lazy-pdf-export.test.mjs tests/v9-unified/lazy-debug-export.test.mjs
          printf '%s\n' '.github/workflows/pdf-load-recovery.yml' 'scripts/pdf-export/verify-load-recovery.mjs' 'src/engine_toolbar.js' | sort > /tmp/expected-paths
          git diff --cached --name-only "$BASE" | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
      - name: Publish only to unchanged feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pdf): offer guarded native print when the optional exporter cannot load'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD HEAD^{tree}
