name: Temporary server tool quota policy validation

on:
  push:
    branches:
      - feat/server-tool-quota-policy-v2-20260930

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check worker/tool_quota_policy.js
          node --check worker/tool_gate.js
          node --check worker/caricature.js
          node --check worker/nikud_merger.js
          node --check src/tool_runtime_gate.js
          node --check src/nikud_merger/nikud_ui.js
          node --check src/nikud_merger/nikud_client_engine.js
          node --check src/sefaria/sefaria_downloader_modal.js
          node --check src/sefaria/sefaria_live_modal.js
          node --check src/torah_nikud/torah_nikud_ui.js
          node --check src/haredi_caricature/caricature_ui.js
          node --check src/comparator_tool/comparator.js
          node --check src/comparator_tool/comparator_ui.js
          node --check src/comparator_tool/comparator_integrated.js
      - name: Quota policy tests
        run: node --test tests/quota/*.test.mjs
      - name: Existing V9 unit regressions
        run: node --test tests/v9-unified/*.test.mjs
      - name: Full build
        run: npm run build
