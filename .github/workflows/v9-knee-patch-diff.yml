name: Temporary V9 patch diff diagnostic

on:
  push:
    branches:
      - fix/v9-knee-row-grid-main-20260930

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Show legacy patch rewrite
        run: |
          cp src/vilna_v9.js /tmp/vilna.before.js
          node scripts/apply_v9_limit_full_strip3_one_line_patch.mjs
          node scripts/apply_v9_column_split_line_edge_guard_patch.mjs
          diff -u /tmp/vilna.before.js src/vilna_v9.js || true
