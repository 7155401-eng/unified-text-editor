name: Public release verification
on:
  pull_request:
    branches: [main]
    paths: ['scripts/release/**', 'tests/integration/public-build-verification.test.mjs', '.github/workflows/public-release-verification.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify release-check logic without network
        run: node --test tests/integration/public-build-verification.test.mjs
      - name: Read public assets and verify the published version
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node scripts/release/verify-public-build.mjs
      - name: Retain actual deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-release-${{ github.run_id }}
          path: test-results/public-release/
          retention-days: 7
          if-no-files-found: warn
