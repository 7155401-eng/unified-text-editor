name: Materialize verified opening-tail source correction
on:
  push:
    branches: [fix/v9-opening-tail-source-20261001]
    paths: [.github/workflows/materialize-opening-tail-source.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == '7155401-eng/unified-text-editor' && github.ref == 'refs/heads/fix/v9-opening-tail-source-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: 6d977e831505d21a23dcacadd8b93b00698d40ac
      TARGET: fix/v9-opening-tail-source-20261001
      RESULT_TREE: cdd10f4fb2c398c662225cf8b87fc3decda32039
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact checked source/test delta and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          printf '%s\n' '5c35fa39ad02a3d0622dcdd41d0c9bc8e748027f657d34d574ed5e101e5d6417  .github/patches/opening-tail-source.patch' | sha256sum -c -
          cp .github/patches/opening-tail-source.patch /tmp/opening-tail-source.patch
          git rm .github/patches/opening-tail-source.patch .github/workflows/materialize-opening-tail-source.yml
          git apply --index --check /tmp/opening-tail-source.patch
          git apply --index /tmp/opening-tail-source.patch
          git diff --cached --check
          test "$(git write-tree)" = "$RESULT_TREE"
          node --check src/engine/v9_main_inline_layout.js
          node --check tests/v9-unified/opening-tail-source.browser.js
          node --check scripts/v9-unified/verify-opening-window-retry.mjs
          node --test tests/v9-unified/opening-tail-source.test.mjs
      - name: Publish only to the unchanged feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$GITHUB_SHA"
          test "$(git write-tree)" = "$RESULT_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v9): keep source glue and note ownership through opening-tail redistribution'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD HEAD^{tree}
