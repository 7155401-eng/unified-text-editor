name: Temporary current-main layout report validation

on:
  push:
    branches:
      - feat/layout-analysis-report-current-main-20260930

permissions:
  contents: read

concurrency:
  group: layout-report-current-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Syntax and all non-browser regressions
        run: |
          node --check src/layout_analysis_report.js
          node --check src/engine/v9_main_inline_layout.js
          node --check src/engine/v9_text_measurement.js
          node --test tests/integration/*.test.mjs
          node --test tests/v9-unified/*.test.mjs
          node --test tests/quota/*.test.mjs
          node --test tests/docx/*.test.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser V9 before build
        run: node scripts/v9-unified/run-browser.mjs
      - name: Full build is source-stable
        run: |
          git diff --exit-code -- index.html src worker cloudflare scripts vite.config.js package.json package-lock.json
          npm run build
          git diff --exit-code -- index.html src worker cloudflare scripts vite.config.js package.json package-lock.json
          npm run build
          git diff --exit-code -- index.html src worker cloudflare scripts vite.config.js package.json package-lock.json
      - name: Repeat report and browser tests after build
        run: |
          node --test tests/integration/layout-analysis-report.test.mjs
          node scripts/v9-unified/run-browser.mjs
