name: Temporary V9 measureMany profile
on:
  push:
    branches: [gpt56sol-v9-measuremany-profile-20261004-0535-0f6b]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Profile measureMany
        run: node scripts/v9-unified/run-render-performance-audit.mjs --root . --out test-results/measuremany-profile.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: measuremany-profile-${{ github.run_id }}
          path: test-results/measuremany-profile.json
          retention-days: 3
