name: Temporary Word marker neutralization validation

on:
  push:
    branches:
      - fix/word-synthetic-marker-neutralization-20261001

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Word extractor regressions
        run: node --test tests/word-extractor/*.test.mjs
      - name: Core regressions
        run: |
          node --test tests/v9-unified/*.test.mjs
          node --test tests/docx/*.test.mjs
          node --test tests/integration/*.test.mjs
      - name: Build
        run: npm run build
      - name: Word extractor regressions after build
        run: node --test tests/word-extractor/*.test.mjs
