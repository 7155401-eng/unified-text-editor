name: Materialize verified split-crown correction
on:
  push:
    branches: [fix/v9-split-crown-rich-20261001]
    paths: [.github/workflows/materialize-split-crown.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == '7155401-eng/unified-text-editor' && github.ref == 'refs/heads/fix/v9-split-crown-rich-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: e2aad9df9d7e67c5a0e10c8a2ebf566160b28a87
      TARGET: fix/v9-split-crown-rich-20261001
      SOURCE_BEFORE: 61a6202593802f3eadbedc6d57b10f9b75735af4
      SOURCE_AFTER: 8ea33d27ac9eff74ecc38728c69c0d4f20fbd4fc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: true
      - name: Apply only the verified source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git hash-object src/vilna_v9.js)" = "$SOURCE_BEFORE"
          printf '%s\n' 'e37f2debed3846363a40911b93860a49d70d63c4554ae39ab192b3dbb4562747  .github/patches/split-crown.patch' | sha256sum -c -
          cp .github/patches/split-crown.patch /tmp/split-crown.patch
          git rm .github/patches/split-crown.patch .github/workflows/materialize-split-crown.yml
          git apply --index --check /tmp/split-crown.patch
          git apply --index /tmp/split-crown.patch
          test "$(git hash-object src/vilna_v9.js)" = "$SOURCE_AFTER"
          git diff --cached --check
          node --check src/vilna_v9.js
          node --check tests/v9-unified/split-crown-rich.browser.js
          node --check scripts/v9-unified/verify-split-crown.mjs
          printf '%s\n' '.github/workflows/v9-split-crown.yml' 'scripts/v9-unified/verify-split-crown.mjs' 'src/vilna_v9.js' 'tests/v9-unified/split-crown-rich.browser.js' | sort > /tmp/expected-paths
          git diff --cached --name-only "$BASE" | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
      - name: Publish to unchanged feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v9): measure both rich-text column starts before reserving crown rows'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD HEAD^{tree}
