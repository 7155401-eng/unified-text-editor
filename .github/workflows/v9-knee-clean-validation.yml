name: Temporary clean V9 knee validation

on:
  push:
    branches:
      - fix/v9-knee-row-grid-clean-20260930

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Syntax and unit regressions
        run: |
          node --check src/vilna_v9.js
          node --check scripts/apply_v9_limit_full_strip3_one_line_patch.mjs
          node --check scripts/apply_v9_column_split_balance_and_expansion_patch.mjs
          node --check tests/v9-unified/browser-spacing-regressions.js
          node --test tests/v9-unified/*.test.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser regressions before build
        run: node scripts/v9-unified/run-browser.mjs
      - name: Full build
        run: npm run build
      - name: Prebuild must not rewrite the knee fix
        run: |
          git diff --exit-code --             src/vilna_v9.js             scripts/apply_v9_limit_full_strip3_one_line_patch.mjs             scripts/apply_v9_column_split_balance_and_expansion_patch.mjs             tests/v9-unified/browser-spacing-regressions.js
      - name: Regressions after build
        run: |
          node --test tests/v9-unified/*.test.mjs
          node scripts/v9-unified/run-browser.mjs
