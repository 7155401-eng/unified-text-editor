name: Apply reviewed existing paragraph centre contracts
on:
  push:
    branches: [fix/v9-exact-paragraph-alignment-20261002]
    paths: [.github/workflows/materialize-alignment-contract-review.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == '7155401-eng/unified-text-editor' && github.ref == 'refs/heads/fix/v9-exact-paragraph-alignment-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify and apply the exact test-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 66dfcb30c5228207283d70b3704f4fcd953d7629
          test "$(git hash-object tests/v9-unified/spacing-regressions.test.mjs)" = 2f3b4e491af5f3b2a2e259a7860f77fc39ef0fb9
          test "$(git hash-object tests/v9-unified/browser-spacing-regressions.js)" = cfc2aaabe8ddc47a0c908a4a8e19dbe42d2200e3
          printf '%s\n' '2a45f4077929896e0833b24da401a75ff73f6f5597af42b0c13a4ed49b467026  .github/patches/alignment-existing-contracts.patch' | sha256sum -c -
          cp .github/patches/alignment-existing-contracts.patch /tmp/contracts.patch
          git rm .github/patches/alignment-existing-contracts.patch .github/workflows/materialize-alignment-contract-review.yml
          git apply --index --check /tmp/contracts.patch
          git apply --index /tmp/contracts.patch
          test "$(git hash-object tests/v9-unified/spacing-regressions.test.mjs)" = cf1853ee4cf3814b34ab69cc76e3ee6e1c23b526
          test "$(git hash-object tests/v9-unified/browser-spacing-regressions.js)" = a452ab15d042efc75aae30b579f4c27c78c4e82e
          git diff --cached --check
          node --test tests/v9-unified/spacing-regressions.test.mjs tests/v9-unified/opening-final-line-centering.test.mjs
          printf '%s\n' tests/v9-unified/spacing-regressions.test.mjs tests/v9-unified/browser-spacing-regressions.js | sort >/tmp/expected
          git diff --cached --name-only a902bd2ca9324f089da4beb7fda26cf29dafc749 | sort >/tmp/actual
          diff -u /tmp/expected /tmp/actual
      - name: Commit only on the unchanged feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/v9-exact-paragraph-alignment-20261002 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(v9): align remaining centre expectations with full-frame collision-safe contract'
          git push origin HEAD:refs/heads/fix/v9-exact-paragraph-alignment-20261002
          git rev-parse HEAD HEAD^{tree}
