name: Temporary render performance audit
on:
  push:
    branches: [gpt56sol-render-perf-20261003-2149-a7d2]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Checkout pre-1078 baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: baa0a90226ac79b0c4b5c4ed482a65732d007586
          path: .perf-pre1078
          persist-credentials: false
      - name: Checkout pre-1060 baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9c4738e1063d4692398091e2b10bae87de365487
          path: .perf-pre1060
          persist-credentials: false
      - name: Share locked dependencies with historical baselines
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/.perf-pre1078/node_modules"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/.perf-pre1060/node_modules"
      - name: Pre-1078 benchmark
        run: node scripts/v9-unified/run-render-performance-audit.mjs --root .perf-pre1078 --out test-results/perf-pre1078.json
      - name: Pre-1060 benchmark
        run: node scripts/v9-unified/run-render-performance-audit.mjs --root .perf-pre1060 --out test-results/perf-pre1060.json
      - name: Checkout pinned current-main baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 98e6f55d02bc2824e0c3fb82d4a04b8f85ba07e6
          path: .perf-baseline
          persist-credentials: false
      - name: Share locked dependencies with baseline
        run: ln -s "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/.perf-baseline/node_modules"
      - name: Baseline benchmark
        run: node scripts/v9-unified/run-render-performance-audit.mjs --root .perf-baseline --out test-results/perf-baseline.json
      - name: Candidate benchmark
        run: node scripts/v9-unified/run-render-performance-audit.mjs --root . --out test-results/perf-candidate.json
      - name: Require identical render output
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('test-results/perf-baseline.json','utf8'));
          const b=JSON.parse(fs.readFileSync('test-results/perf-candidate.json','utf8'));
          for (let i=0;i<a.cases.length;i++) {
            const x=a.cases[i],y=b.cases[i];
            if (x.name!==y.name || x.pages!==y.pages || x.complete!==y.complete ||
                x.sourceChars!==y.sourceChars || x.renderedChars!==y.renderedChars ||
                x.domSha256!==y.domSha256) {
              throw new Error('Render output drift: '+JSON.stringify({baseline:x,candidate:y}));
            }
          }
          const summary=a.cases.map((x,i)=>({name:x.name,baselineMs:x.ms,candidateMs:b.cases[i].ms,
            ratio:b.cases[i].ms/Math.max(1,x.ms),baselineMaxLongTask:x.maxLongTask,candidateMaxLongTask:b.cases[i].maxLongTask}));
          console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: temporary-render-performance-${{ github.run_id }}
          path: test-results/perf-*.json
          retention-days: 3
