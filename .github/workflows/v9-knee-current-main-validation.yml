name: Temporary current-main V9 knee validation

on:
  push:
    branches:
      - fix/v9-knee-row-grid-current-main-20260930

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: V9 units
        run: node --test tests/v9-unified/*.test.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser regressions
        run: node scripts/v9-unified/run-browser.mjs
      - name: Full build
        run: npm run build
      - name: Regressions after build
        run: |
          node --test tests/v9-unified/*.test.mjs
          node scripts/v9-unified/run-browser.mjs
