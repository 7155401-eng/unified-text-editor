name: Materialize verified footer reservation candidate
on:
  push:
    branches: [fix/v9-footer-space-reservation-20261001]
    paths: [.github/workflows/materialize-footer-reservation.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == '7155401-eng/unified-text-editor' && github.ref == 'refs/heads/fix/v9-footer-space-reservation-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: ab24421e44262a9f52791a900598cfa7eb9879fc
      TARGET: fix/v9-footer-space-reservation-20261001
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exactly the reviewed one-file product patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git hash-object src/vilna_v9.js)" = 657e6618a77cf11edade858b1bad377df3da5b5a
          printf '%s\n' 'bdc7bcc296e0d5f435e4d0a32ea5e7d0a1d0c81e7fa0c1c076ad6b16c52645d1  .github/patches/footer-space-reservation.patch' | sha256sum -c -
          cp .github/patches/footer-space-reservation.patch /tmp/footer-space-reservation.patch
          git rm .github/patches/footer-space-reservation.patch .github/workflows/materialize-footer-reservation.yml
          git apply --index --check /tmp/footer-space-reservation.patch
          git apply --index /tmp/footer-space-reservation.patch
          test "$(git hash-object src/vilna_v9.js)" = 9b25e6247954373d56c2ef4197b3c09cfd9dcea1
          test "$(git hash-object tests/v9-unified/footer-space-reservation.browser.js)" = 1467fc84b2dd047a62e79de393146ae44d43598b
          test "$(git hash-object tests/v9-unified/footer-space-pagination.browser.js)" = ad7507e2a9b4f07dc8c60b4005698729307a5e1e
          test "$(git hash-object scripts/v9-unified/verify-footer-space-reservation.mjs)" = d5a4473c65afa5bdabb9fa0281be4b617fa6eeaf
          git diff --cached --check
          node --check src/vilna_v9.js
          node --check tests/v9-unified/footer-space-reservation.browser.js
          node --check tests/v9-unified/footer-space-pagination.browser.js
          node --check scripts/v9-unified/verify-footer-space-reservation.mjs
          printf '%s\n' '.github/workflows/v9-footer-space-reservation.yml' 'scripts/v9-unified/verify-footer-space-reservation.mjs' 'src/vilna_v9.js' 'tests/v9-unified/footer-space-pagination.browser.js' 'tests/v9-unified/footer-space-reservation.browser.js' | sort > /tmp/expected-paths
          git diff --cached --name-only "$BASE" | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
      - name: Publish to the unchanged candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v9): reserve complete anchored footers before accepting side-note continuation'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD HEAD^{tree}
