name: Temporary V9 page tweaker constraints

on:
  push:
    branches:
      - feat/v9-page-tweaker-constraints-20261001

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check src/page_tweaks.js
          node --check src/pane_manager.js
          node --check src/vilna_v9.js
          node --check src/vilna_v9_apply.js
          node --check src/engine_bridge.js
      - name: V9 units
        run: node --test tests/v9-unified/*.test.mjs
      - name: Chromium
        run: |
          npx --no-install playwright install --with-deps chromium
          node scripts/v9-unified/run-browser.mjs
      - name: Build twice source-pristine
        run: |
          git diff --exit-code -- src scripts package.json package-lock.json
          npm run build
          git diff --exit-code -- src scripts package.json package-lock.json
          npm run build
          git diff --exit-code -- src scripts package.json package-lock.json
      - name: Regress after build
        run: |
          node --test tests/v9-unified/*.test.mjs
          node scripts/v9-unified/run-browser.mjs
