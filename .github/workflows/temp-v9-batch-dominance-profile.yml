name: Temporary V9 batch dominance profile
on:
  push:
    branches: [gpt56sol-v9-batch-dominance-profile-20261004-0336-3e71]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Profile current exact-tail batching
        run: node scripts/v9-unified/run-render-performance-audit.mjs --root . --out test-results/batch-dominance-profile.json
