name: Temporary post-1116 live PDF acceptance
on:
  push:
    branches: [audit/live-pdf-post1116-20261004-0254]
    paths: ['.github/workflows/temp-post1116-live-pdf.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 868b2dccb8d6aefc930bf8a178d81a6db9518632
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify deployed data-URL recovery and actual live PDF
        run: |
          mkdir -p test-results/live-pdf
          cat > live.mjs <<'EOF'
          import { chromium } from 'playwright-chromium';
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            acceptDownloads:true,
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36',
            extraHTTPHeaders:{'accept-language':'he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7'}
          });
          const page=await context.newPage();
          page.setDefaultTimeout(90000);
          const pageErrors=[];
          const consoleMessages=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('console',m=>consoleMessages.push({type:m.type(),text:m.text()}));

          const root=await page.goto('https://app.ravtext.com/',{waitUntil:'domcontentloaded',timeout:45000});
          const probe=await page.evaluate(async()=>{
            const url='/assets/pdf_export.js?post1116='+Date.now();
            const r=await fetch(url,{cache:'no-store'});
            const source=await r.text();
            let imported=false,exportType='',importError='';
            try {
              const mod=await import(url);
              imported=true;
              exportType=typeof mod.downloadPagesAsPdf;
            } catch(e) { importError=String(e); }
            return {
              status:r.status,
              contentType:r.headers.get('content-type')||'',
              bytes:source.length,
              hasDataUrlRetry:source.includes('retrying page via data URL'),
              hasCreateSvgDataUrl:source.includes('createSvgDataUrl'),
              imported,exportType,importError
            };
          });

          fs.mkdirSync('test-results/live-pdf',{recursive:true});
          fs.writeFileSync('test-results/live-pdf/module-probe.json',JSON.stringify(probe,null,2));

          if(root?.status()!==200) throw new Error('root HTTP '+root?.status());
          if(probe.status!==200 || !probe.imported || probe.exportType!=='function')
            throw new Error('live module failed '+JSON.stringify(probe));
          if(!probe.hasDataUrlRetry)
            throw new Error('live deployment has not reached #1116 yet: '+JSON.stringify(probe));

          await page.evaluate(()=>{
            const host=document.createElement('div');
            host.id='gpt-live-pdf-post1116';
            host.className='pages-container';
            for(let i=0;i<2;i++){
              const p=document.createElement('section');
              p.className='page v9-page';
              p.style.cssText='width:380px;height:537px;padding:24px;box-sizing:border-box;background:#fff;color:#222;direction:rtl;font-family:serif;font-size:22px;line-height:1.55';
              p.innerHTML='<p class="v9-line v9-role-main" style="font-family:serif">בדיקת PDF חיה '+(i+1)+'</p><p>אב גד הוז חטי כלמ נסע פצק.</p>';
              host.append(p);
            }
            document.body.append(host);
          });

          const downloadPromise=page.waitForEvent('download',{timeout:90000});
          const exportPromise=page.evaluate(async()=>{
            const mod=await import('/assets/pdf_export.js?export='+Date.now());
            return mod.downloadPagesAsPdf(
              document.querySelector('#gpt-live-pdf-post1116'),
              {filename:'post1116-live.pdf',includeBackgrounds:false,fallbackToPrint:false}
            );
          });
          const [download,result]=await Promise.all([downloadPromise,exportPromise]);
          const failure=await download.failure();
          if(failure) throw new Error('download failure '+failure);
          const path=await download.path();
          if(!path) throw new Error('no download path');
          const pdf=fs.readFileSync(path);
          const text=pdf.toString('latin1');
          const pageCount=(text.match(/\/Type\s*\/Page(?!s)/g)||[]).length;
          const report={
            rootStatus:root.status(),
            probe,
            exportResult:result,
            suggestedFilename:download.suggestedFilename(),
            pdfBytes:pdf.length,
            pdfSha256:crypto.createHash('sha256').update(pdf).digest('hex'),
            pdfHeader:pdf.subarray(0,8).toString('latin1'),
            pdfPageObjects:pageCount,
            pageErrors,
            consoleMessages
          };
          fs.writeFileSync('test-results/live-pdf/post1116-live.pdf',pdf);
          fs.writeFileSync('test-results/live-pdf/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(result?.fallback) throw new Error('unexpected fallback');
          if(!report.pdfHeader.startsWith('%PDF-')||pdf.length<1000) throw new Error('not PDF');
          if(pageCount!==3) throw new Error('expected 3 pages, got '+pageCount);
          if(pageErrors.length) throw new Error('page errors '+JSON.stringify(pageErrors));
          await browser.close();
          EOF
          node live.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post1116-live-pdf-${{ github.run_id }}
          path: test-results/live-pdf/
          retention-days: 7
          if-no-files-found: warn
