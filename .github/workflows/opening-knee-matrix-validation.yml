name: Temporary opening-knee matrix validation

on:
  push:
    branches:
      - test/v9-opening-knee-matrix-20261001

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: V9 unit matrix
        run: node --test tests/v9-unified/spacing-regressions.test.mjs
      - name: Full V9 unit suite
        run: node --test tests/v9-unified/*.test.mjs
