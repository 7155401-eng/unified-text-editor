name: Materialize verified occupied-end correction
on:
  push:
    branches: [fix/v9-occupied-end-20261001]
    paths: [.github/workflows/materialize-occupied-end.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == '7155401-eng/unified-text-editor' && github.ref == 'refs/heads/fix/v9-occupied-end-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: c617346d7bcc7688770e4dd801e7cfb954427f57
      TARGET: fix/v9-occupied-end-20261001
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact reviewed source and regression-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def blob(p):
            b=Path(p).read_bytes()
            return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          p=Path('src/engine/v9_main_inline_layout.js')
          assert blob(p)=='32ec3c1839173c6461005f4e68697c52cfa8d672'
          s=p.read_text()
          old="    return { lines: lines.map(l => freezeLine(structuredClone(l))), endY: y, overflowText, overflowParagraphs: remaining, diagnostics, overflowReason: reason, debug: null };"
          new="""    // Search can visit later strips without placing anything there. Only
              // committed rows and opening windows occupy the page; a rejected candidate
              // must not reserve empty space or push neighbouring streams/footers down.
              // Keep real source-break rows and the FULL window of an emitted opening,
              // including early page/row-limit returns before its body has finished.
              const endY = lines.reduce((bottom, line) => Math.max(
                bottom, line.y + line.lineHeightPx,
                line.render.opening ? line.render.opening.y + line.render.opening.height : bottom
              ), strips[0]?.y_start || 0);
              return { lines: lines.map(l => freezeLine(structuredClone(l))), endY, overflowText, overflowParagraphs: remaining, diagnostics, overflowReason: reason, debug: null };"""
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          assert blob(p)=='8666aef8a49b5676237570378c538b05d27a599b'
          p=Path('.github/workflows/cross-bot-regression-guard.yml')
          assert blob(p)=='2a5eef6fa7807c8402daaecb3704df021d3e12db'
          s=p.read_text()
          anchor='      - name: Regular renderer BiDi regression\n'
          insert="\n".join([
            '      - name: Read-only pre-fix source for occupancy and preservation comparison',
            '        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683',
            '        with:',
            '          ref: c617346d7bcc7688770e4dd801e7cfb954427f57',
            '          path: .occupied-baseline',
            '          persist-credentials: false',
            '      - name: Occupied extent excludes failed attempts and preserves emitted content',
            '        run: |',
            '          node scripts/v9-unified/verify-occupied-end.mjs',
            '          cp test-results/occupied-end/report.json test-results/occupied-end/before-build.json',''])
          assert s.count(anchor)==1
          s=s.replace(anchor,insert+anchor)
          anchor='          node scripts/v9-unified/verify-opening-window-retry.mjs\n          node --test tests/integration/'
          assert s.count(anchor)==1
          s=s.replace(anchor,'          node scripts/v9-unified/verify-opening-window-retry.mjs\n          node scripts/v9-unified/verify-occupied-end.mjs\n          node --test tests/integration/')
          s+='\n'.join([
            '      - name: Retain occupied-end comparison and unresolved-baseline diagnostics',
            '        if: always()',
            '        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02',
            '        with:',
            '          name: occupied-end-' + '$' + '{{ github.run_id }}',
            '          path: test-results/occupied-end/',
            '          retention-days: 7',
            '          if-no-files-found: warn',''])
          p.write_text(s)
          assert blob(p)=='62e326f31451fbd349a79692c643402e17a3a5ff'
          PY
          git rm .github/workflows/materialize-occupied-end.yml
          git add src/engine/v9_main_inline_layout.js .github/workflows/cross-bot-regression-guard.yml
          git diff --cached --check
          node --check src/engine/v9_main_inline_layout.js
          node --test tests/v9-unified/occupied-end.test.mjs
          printf '%s\n' '.github/workflows/cross-bot-regression-guard.yml' 'scripts/v9-unified/verify-occupied-end.mjs' 'src/engine/v9_main_inline_layout.js' 'tests/v9-unified/occupied-end.browser.js' 'tests/v9-unified/occupied-end.test.mjs' | sort > /tmp/expected-paths
          git diff --cached --name-only "$BASE" | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
      - name: Publish only to the unchanged feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v9): report occupied rows and openings, not failed placement attempts'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD HEAD^{tree}
