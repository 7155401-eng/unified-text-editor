name: Materialize verified short-stream grid correction
on:
  push:
    branches: [fix/v9-short-stream-grid-20261001]
    paths: [.github/workflows/apply-short-stream-grid.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == '7155401-eng/unified-text-editor' && github.ref == 'refs/heads/fix/v9-short-stream-grid-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: af3f3579faedf0002fcee6831a79c68be77b6572
      TARGET: fix/v9-short-stream-grid-20261001
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: true
      - name: Apply exact checked delta and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git hash-object src/vilna_v9.js)" = 68ffd7e245b5add807b0c9f60b3da10c8c857daa
          test "$(git hash-object tests/v9-unified/split-crown-rich.browser.js)" = fe55be1470aaf6b3ddc0173c2769e642d7d943f6
          test "$(git hash-object scripts/v9-unified/verify-split-crown.mjs)" = 7f8cd9d8de08672a7cf306daeb39891b1e7e5404
          printf '%s\n' 'a627f4f1fcc2a315ce96487bb2658c3d79e5f319e3eef5d541267758afefac46  .github/patches/short-stream-grid.patch' | sha256sum -c -
          cp .github/patches/short-stream-grid.patch /tmp/short-stream-grid.patch
          git rm .github/patches/short-stream-grid.patch .github/workflows/apply-short-stream-grid.yml
          git apply --index --check /tmp/short-stream-grid.patch
          git apply --index /tmp/short-stream-grid.patch
          test "$(git hash-object src/vilna_v9.js)" = 8ddbeb1cd9e5c7323189ee455a357b18015981cb
          test "$(git hash-object tests/v9-unified/split-crown-rich.browser.js)" = a97dc75e805641fb970a22d621bb452e4c154fe4
          test "$(git hash-object scripts/v9-unified/verify-split-crown.mjs)" = 409654b99c0b7867ae96779036d8254e49645e77
          git diff --cached --check
          node --check src/vilna_v9.js
          node --check tests/v9-unified/split-crown-rich.browser.js
          node --check scripts/v9-unified/verify-split-crown.mjs
          printf '%s\n' 'scripts/v9-unified/verify-split-crown.mjs' 'src/vilna_v9.js' 'tests/v9-unified/split-crown-rich.browser.js' | sort > /tmp/expected-paths
          git diff --cached --name-only "$BASE" | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
      - name: Publish only to unchanged feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v9): align delayed equal-pitch stream starts before planning their knees'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD HEAD^{tree}
