name: Materialize verified paragraph-alignment candidate
on:
  push:
    branches: [fix/v9-exact-paragraph-alignment-20261002]
    paths: [.github/workflows/materialize-exact-alignment.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == '7155401-eng/unified-text-editor' && github.ref == 'refs/heads/fix/v9-exact-paragraph-alignment-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: 9c4738e1063d4692398091e2b10bae87de365487
      TARGET: fix/v9-exact-paragraph-alignment-20261002
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply only the verified product and contract delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git hash-object src/engine/v9_main_inline_layout.js)" = 03d31532634f116aa59c2712bbc6c3134f549688
          test "$(git hash-object tests/v9-unified/opening-final-line-centering.test.mjs)" = c52a75afbe320acdd90934bdc3205bf9404e7bea
          printf '%s\n' 'caefc623e462b82a1adfac300d507f5f270c0efb6662d92a49352ba049188362  .github/patches/exact-paragraph-alignment.patch' | sha256sum -c -
          cp .github/patches/exact-paragraph-alignment.patch /tmp/exact-paragraph-alignment.patch
          git rm .github/patches/exact-paragraph-alignment.patch .github/workflows/materialize-exact-alignment.yml
          git apply --index --check /tmp/exact-paragraph-alignment.patch
          git apply --index /tmp/exact-paragraph-alignment.patch
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,hashlib,os
          expected={
            'src/engine/v9_main_inline_layout.js':'7e6052caa92de3ee07541bd21e9212447571e313',
            'src/engine/v9_exact_tail_partition.js':'f2d00a9131dde63ff1035c8edf6c042de3e7c6bf',
            'tests/v9-unified/opening-final-line-centering.test.mjs':'52f980e239124ecbfa801aea72d5ef0ce650cdc5',
            'tests/v9-unified/exact-tail-partition.test.mjs':'5d2156e9ae2566891174e4de2ddffcee8d52504b',
            'tests/v9-unified/exact-paragraph-alignment.browser.js':'873ba98074aef76d51e16441ade73888dd5b1dbd',
            'tests/v9-unified/exact-paragraph-pagination.browser.js':'84e6845aabce38c8f22fd3d3f2dc13f5ea4fa229',
            'scripts/v9-unified/verify-exact-paragraph-alignment.mjs':'a8f72e388717c232707cb3a361f687c330b3c7b3',
            '.github/workflows/v9-exact-paragraph-alignment.yml':'c9fb4e8829f516002fee37ec5a85c4635184c57c',
          }
          for path,sha in expected.items():
              data=Path(path).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha,path
          changed=subprocess.check_output(['git','diff','--cached','--name-only',os.environ['BASE']],text=True).splitlines()
          assert set(changed)==set(expected),changed
          PY
          git diff --cached --check
          node --check src/engine/v9_main_inline_layout.js
          node --check scripts/v9-unified/verify-exact-paragraph-alignment.mjs
          node --test tests/v9-unified/exact-tail-partition.test.mjs tests/v9-unified/opening-final-line-centering.test.mjs
      - name: Publish only to the unchanged feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v9): recover exact gentle tail partitions and centre safe two-row endings'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD HEAD^{tree}
