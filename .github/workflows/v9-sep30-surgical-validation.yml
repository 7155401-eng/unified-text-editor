name: V9 Sep30 surgical validation
on:
  push:
    branches: [fix/v9-sep30-surgical-regressions]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v9-sep30-surgical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax and unit regressions
        run: |
          node --check src/vilna_v9.js
          node --check src/engine/v9_main_inline_layout.js
          node --check src/engine/v9_stream_inline_layout.js
          node --check src/engine/runs_dom.js
          node --check src/server_persistence.js
          node --test tests/v9-unified/*.test.mjs
      - name: Install locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser regressions
        run: node scripts/v9-unified/run-browser.mjs
      - name: Production build
        run: npm run postinstall && npm run build
      - name: Repeat regressions after build
        run: |
          node --test tests/v9-unified/*.test.mjs
          node scripts/v9-unified/run-browser.mjs
