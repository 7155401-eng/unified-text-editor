name: Temporary V9 stream line-height validation

on:
  push:
    branches:
      - fix/v9-stream-lineheight-source-of-truth-20261001

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Syntax and V9 units
        run: |
          node --check src/engine/v9_stream_inline_layout.js
          node --check src/vilna_v9.js
          node --check src/vilna_v9_apply.js
          node --test tests/v9-unified/*.test.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser regressions
        run: node scripts/v9-unified/run-browser.mjs
      - name: Full build
        run: npm run build
      - name: Repeat after build
        run: |
          node --test tests/v9-unified/*.test.mjs
          node scripts/v9-unified/run-browser.mjs
