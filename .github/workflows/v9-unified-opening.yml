name: V9 unified opening layout validation

on:
  push:
    branches: [fix/v9-unified-opening-layout]
    paths:
      - '.github/workflows/v9-unified-opening.yml'
      - 'src/**'
      - 'tests/v9-unified/**'
      - 'scripts/**'
      - 'package*.json'
  pull_request:
    paths:
      - '.github/workflows/v9-unified-opening.yml'
      - 'src/**'
      - 'tests/v9-unified/**'
      - 'scripts/**'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v9-unified-opening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/fix/v9-unified-opening-layout' || github.head_ref == 'fix/v9-unified-opening-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax and deterministic source/geometry tests
        run: |
          mkdir -p test-results/v9-unified
          git rev-parse HEAD | tee test-results/v9-unified/commit.txt
          node --check src/vilna_v9.js
          node --check src/vilna_v9_apply.js
          node --test tests/v9-unified/*.test.mjs | tee test-results/v9-unified/unit.tap
      - name: Install locked dependencies
        id: deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser layout and pagination regression suite
        run: node scripts/v9-unified/run-browser.mjs
      - name: Build and verify source remains unchanged
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          npm run postinstall 2>&1 | tee test-results/v9-unified/postinstall.log
          npm run build 2>&1 | tee test-results/v9-unified/build.log
          git diff --exit-code -- src scripts
          node --test tests/v9-unified/*.test.mjs | tee test-results/v9-unified/unit-after-build.tap
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-validation-${{ github.run_id }}
          path: test-results/v9-unified/
          retention-days: 7
          if-no-files-found: warn
