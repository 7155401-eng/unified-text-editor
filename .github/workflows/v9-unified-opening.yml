name: V9 unified opening layout validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v9-unified-opening-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax and deterministic source/geometry tests
        run: |
          mkdir -p test-results/v9-unified
          git rev-parse HEAD | tee test-results/v9-unified/commit.txt
          node --check src/vilna_v9.js
          node --check src/vilna_v9_apply.js
          node --test tests/v9-unified/*.test.mjs | tee test-results/v9-unified/unit.tap
      - name: Install locked dependencies
        id: deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser layout and pagination regression suite
        run: node scripts/v9-unified/run-browser.mjs
      - name: Fetch current main baseline for build comparison
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: .v9-baseline
          persist-credentials: false
      - name: Build current main baseline
        id: baseline_build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          cmp package-lock.json .v9-baseline/package-lock.json
          ln -s "$GITHUB_WORKSPACE/node_modules" .v9-baseline/node_modules
          (
            cd .v9-baseline
            npm run postinstall
            npm run build
          ) 2>&1 | tee test-results/v9-unified/baseline-build.log
      - name: Build selected ref and verify source integrity
        if: ${{ !cancelled() && steps.baseline_build.outcome == 'success' }}
        run: |
          npm run postinstall 2>&1 | tee test-results/v9-unified/postinstall.log
          npm run build 2>&1 | tee test-results/v9-unified/build.log
          node scripts/v9-unified/verify-build-sources.mjs .v9-baseline
          node --test tests/v9-unified/*.test.mjs | tee test-results/v9-unified/unit-after-build.tap
          cp test-results/v9-unified/browser.json test-results/v9-unified/browser-before-build.json
          node scripts/v9-unified/run-browser.mjs
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-validation-${{ github.run_id }}
          path: test-results/v9-unified/
          retention-days: 7
          if-no-files-found: warn
