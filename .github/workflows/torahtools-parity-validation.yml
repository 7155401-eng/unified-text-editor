name: Temporary torahtools parity validation

on:
  push:
    branches:
      - docs/torahtools-v9-parity-20260930

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Parity contract
        run: node --test tests/integration/torahtools-v9-parity.test.mjs
      - name: All integration tests
        run: node --test tests/integration/*.test.mjs
      - name: Source-stable build
        run: |
          git diff --exit-code -- index.html src worker cloudflare scripts package.json package-lock.json
          npm run build
          git diff --exit-code -- index.html src worker cloudflare scripts package.json package-lock.json
