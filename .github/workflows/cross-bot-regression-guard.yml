name: Cross-bot regression guard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'worker/**'
      - 'cloudflare/**'
      - 'scripts/**'
      - 'tests/**'
      - 'styles.css'
      - 'theme-base-refresh.css'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'worker/**'
      - 'cloudflare/**'
      - 'scripts/**'
      - 'tests/**'
      - 'styles.css'
      - 'theme-base-refresh.css'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Cross-bot source contracts
        run: node --test tests/integration/*.test.mjs
      - name: V9 unit/source regressions
        run: node --test tests/v9-unified/*.test.mjs
      - name: Word extractor regressions
        run: node --test tests/word-extractor/*.test.mjs
      - name: Desktop page-tweaker file compatibility
        run: node scripts/verify_page_tweaker.mjs
      - name: Text-to-speech engine
        run: node scripts/verify_tts_engine.mjs
      - name: Marker placement proposal engine
        run: node scripts/verify_marker_proposal.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: V9 browser regressions
        run: node scripts/v9-unified/run-browser.mjs
      - name: Page tweaker screen in a real browser
        run: node scripts/verify_page_tweaker_browser.mjs
      - name: Text-to-speech screen in a real browser
        run: node scripts/verify_tts_browser.mjs
      - name: Marker proposal screen in a real browser
        run: node scripts/verify_marker_proposal_browser.mjs
      - name: Hebrew combining marks match native font pixels
        run: node scripts/v9-unified/verify-combining-marks.mjs
      - name: Hidden references preserve text shaping and planned geometry
        run: |
          node scripts/v9-unified/verify-hidden-reference-shaping.mjs
          cp test-results/hidden-reference-shaping/report.json test-results/hidden-reference-shaping/before-build.json
      - name: Opening window uses newly widened rows without losing crown or knee fixes
        run: |
          node scripts/v9-unified/verify-opening-window-retry.mjs
          cp test-results/opening-window-retry/report.json test-results/opening-window-retry/before-build.json
      - name: Read-only pre-fix source for occupancy and preservation comparison
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c617346d7bcc7688770e4dd801e7cfb954427f57
          path: .occupied-baseline
          persist-credentials: false
      - name: Occupied extent excludes failed attempts and preserves emitted content
        run: |
          node scripts/v9-unified/verify-occupied-end.mjs
          cp test-results/occupied-end/report.json test-results/occupied-end/before-build.json
      - name: Regular renderer BiDi regression
        run: node scripts/verify-regular-renderer-bidi.mjs
      - name: V9 bracket glyph raster matches native Chromium
        run: node scripts/v9-unified/verify-bracket-raster.mjs
      - name: DOCX to renderer BiDi end-to-end
        run: node scripts/verify-docx-to-renderer-bidi-e2e.mjs
      - name: Quota regressions
        run: node --test tests/quota/*.test.mjs
      - name: DOCX regressions
        run: node --test tests/docx/*.test.mjs
      - name: Source must be pristine before build
        run: git diff --exit-code -- index.html src worker cloudflare scripts vite.config.js package.json package-lock.json
      - name: Build twice without rewriting tracked source
        run: |
          npm run build
          git diff --exit-code -- index.html src worker cloudflare scripts vite.config.js package.json package-lock.json
          npm run build
          git diff --exit-code -- index.html src worker cloudflare scripts vite.config.js package.json package-lock.json
      - name: Repeat cross-bot contracts after build
        run: |
          node --test tests/v9-unified/*.test.mjs
          node scripts/v9-unified/verify-combining-marks.mjs
          node scripts/v9-unified/verify-hidden-reference-shaping.mjs
          node scripts/v9-unified/verify-opening-window-retry.mjs
          node scripts/v9-unified/verify-occupied-end.mjs
          node --test tests/integration/*.test.mjs
          node --test tests/word-extractor/*.test.mjs
          node scripts/verify_page_tweaker.mjs
          node scripts/verify_tts_engine.mjs
          node scripts/verify_marker_proposal.mjs
          node --test tests/quota/*.test.mjs
          node --test tests/docx/*.test.mjs
          node scripts/v9-unified/run-browser.mjs
          node scripts/verify-regular-renderer-bidi.mjs
          node scripts/v9-unified/verify-bracket-raster.mjs
          node scripts/verify-docx-to-renderer-bidi-e2e.mjs
      - name: Retain optical Hebrew niqqud proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optical-niqqud-${{ github.run_id }}
          path: |
            test-results/v9-unified/combining-marks.json
            test-results/v9-unified/optical-niqqud-specimen.png
          retention-days: 7
          if-no-files-found: error
      - name: Retain hidden-reference shaping evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hidden-reference-shaping-${{ github.run_id }}
          path: test-results/hidden-reference-shaping/
          retention-days: 7
          if-no-files-found: warn
      - name: Retain opening-window retry evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opening-window-retry-${{ github.run_id }}
          path: test-results/opening-window-retry/
          retention-days: 7
          if-no-files-found: warn
      - name: Retain occupied-end comparison and unresolved-baseline diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: occupied-end-${{ github.run_id }}
          path: test-results/occupied-end/
          retention-days: 7
          if-no-files-found: warn
