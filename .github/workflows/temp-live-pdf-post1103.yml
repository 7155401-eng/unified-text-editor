name: Temporary live PDF post-1103 diagnostic
on:
  push:
    branches: [audit/live-pdf-post1103-20261004-2227]
    paths: ['.github/workflows/temp-live-pdf-post1103.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Diagnose live cover separately from full PDF export
        shell: bash
        run: |
          mkdir -p test-results/live-pdf-post1103
          cat > live-pdf-post1103.mjs <<'EOF'
          import { chromium } from 'playwright-chromium';
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const out='test-results/live-pdf-post1103';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            acceptDownloads:true,
            viewport:{width:1280,height:900},
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36',
            extraHTTPHeaders:{'accept-language':'he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7'}
          });
          const page=await context.newPage();
          page.setDefaultTimeout(120000);

          const pageErrors=[];
          const consoleMessages=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('console',m=>{
            if(['warning','error','log','info'].includes(m.type())){
              consoleMessages.push({type:m.type(),text:m.text()});
            }
          });

          const report={
            rootStatus:0,
            finalUrl:'',
            moduleProbe:null,
            foreignObjectSchemeProbe:null,
            coverProbe:null,
            exportProbe:null,
            download:null,
            pageErrors,
            consoleMessages,
          };

          try {
            const root=await page.goto('https://app.ravtext.com/',{
              waitUntil:'domcontentloaded',timeout:60000
            });
            report.rootStatus=root?.status()||0;
            report.finalUrl=page.url();

            report.moduleProbe=await page.evaluate(async()=>{
              const url='/assets/pdf_export.js?post1103-module='+Date.now();
              const response=await fetch(url,{cache:'no-store'});
              const bytes=(await response.clone().arrayBuffer()).byteLength;
              let imported=false,exportType='',coverRecoveryType='',importError='';
              try{
                const mod=await import(url);
                imported=true;
                exportType=typeof mod.downloadPagesAsPdf;
                coverRecoveryType=typeof mod.renderPdfCoverImageWithRecovery;
              }catch(e){importError=String(e)}
              return {
                url,status:response.status,
                contentType:response.headers.get('content-type')||'',
                bytes,imported,exportType,coverRecoveryType,importError
              };
            });

            // Probe the exact browser primitive used by content-page rendering:
            // SVG <foreignObject> drawn from blob: versus data:.
            report.foreignObjectSchemeProbe=await page.evaluate(async()=>{
              const svg='<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80">'
                +'<foreignObject width="200" height="80">'
                +'<div xmlns="http://www.w3.org/1999/xhtml" style="font:20px serif;color:black;background:white">foreignObject probe</div>'
                +'</foreignObject></svg>';

              async function probe(src,cleanup){
                const img=new Image();
                img.decoding='sync';
                try{
                  img.src=src;
                  await (img.decode?img.decode():new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;}));
                  const canvas=document.createElement('canvas');
                  canvas.width=200;canvas.height=80;
                  const ctx=canvas.getContext('2d',{alpha:false,willReadFrequently:true});
                  ctx.fillStyle='white';ctx.fillRect(0,0,200,80);
                  ctx.drawImage(img,0,0);
                  let readOk=false,blobOk=false,readError='',blobError='';
                  try{ctx.getImageData(0,0,1,1);readOk=true;}catch(e){readError=String(e);}
                  try{
                    await new Promise((resolve,reject)=>{
                      try{
                        canvas.toBlob(b=>b?resolve(b):reject(new Error('null blob')),'image/png');
                      }catch(e){reject(e);}
                    });
                    blobOk=true;
                  }catch(e){blobError=String(e);}
                  return {readOk,blobOk,readError,blobError};
                }finally{cleanup?.();}
              }

              const blobUrl=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
              const blob=await probe(blobUrl,()=>URL.revokeObjectURL(blobUrl));
              const dataUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
              const data=await probe(dataUrl);
              return {blob,data};
            });

            // Isolate the first stage. If this succeeds while full export fails,
            // the remaining taint is in content-page SVG/canvas rendering.
            report.coverProbe=await page.evaluate(async()=>{
              try{
                const mod=await import('/assets/pdf_export.js?post1103-cover='+Date.now());
                const image=await mod.renderPdfCoverImageWithRecovery({
                  contentPageCount:1,
                  filename:'post1103-cover-probe.pdf',
                });
                return {
                  ok:true,
                  bytes:image?.bytes?.length||0,
                  width:image?.width||0,
                  height:image?.height||0,
                  filter:image?.filter||'',
                };
              }catch(e){
                return {ok:false,error:String(e),stack:String(e?.stack||'')};
              }
            });

            await page.evaluate(()=>{
              document.getElementById('post1103-live-probe')?.remove();
              const host=document.createElement('div');
              host.id='post1103-live-probe';
              host.className='pages-container';
              const p=document.createElement('section');
              p.className='page v9-page';
              p.dir='rtl';
              p.style.cssText='position:relative;width:380px;height:537px;padding:24px;box-sizing:border-box;background:white;color:#222;font:22px/1.55 serif;';
              p.innerHTML='<p>בדיקת PDF חיה לאחר תיקון cover</p><p>אב גד הוז חטי כלמ נסע פצק.</p>';
              host.append(p);
              document.body.append(host);
            });

            const exportOutcome=await page.evaluate(async()=>{
              try{
                const mod=await import('/assets/pdf_export.js?post1103-full='+Date.now());
                const result=await mod.downloadPagesAsPdf(
                  document.getElementById('post1103-live-probe'),
                  {
                    filename:'post1103-live-probe.pdf',
                    includeBackgrounds:false,
                    fallbackToPrint:false,
                  }
                );
                return {ok:true,result};
              }catch(e){
                return {ok:false,error:String(e),stack:String(e?.stack||'')};
              }
            });
            report.exportProbe=exportOutcome;

            if(exportOutcome.ok){
              // The product clicks an anchor before the evaluate promise resolves.
              // If a download event was missed, the successful exporter result still
              // distinguishes export success from the taint failure under diagnosis.
              report.download={note:'export completed without exception; direct download bytes are not required for stage isolation'};
            }
          } catch(e) {
            report.harnessError={error:String(e),stack:String(e?.stack||'')};
          } finally {
            fs.writeFileSync(out+'/report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            await browser.close();
          }

          // Diagnostic success means we produced evidence, not that the product passed.
          // Fail only for a broken harness/module; preserve a product failure in report.json.
          if(report.rootStatus!==200)process.exitCode=2;
          if(!report.moduleProbe?.imported)process.exitCode=3;
          if(report.moduleProbe?.coverRecoveryType!=='function')process.exitCode=4;
          EOF
          node live-pdf-post1103.mjs
      - name: Upload live diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-pdf-post1103-diagnostic-${{ github.run_id }}
          path: test-results/live-pdf-post1103/
          retention-days: 7
          if-no-files-found: error
