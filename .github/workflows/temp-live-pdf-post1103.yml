name: Temporary live PDF post-1103 acceptance
on:
  push:
    branches: [audit/live-pdf-post1103-20261004-2227]
    paths: ['.github/workflows/temp-live-pdf-post1103.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Live app imports exporter and downloads a real PDF
        shell: bash
        run: |
          mkdir -p test-results/live-pdf-post1103
          cat > live-pdf-post1103.mjs <<'EOF'
          import { chromium } from 'playwright-chromium';
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const out='test-results/live-pdf-post1103';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            acceptDownloads:true,
            viewport:{width:1280,height:900},
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36',
            extraHTTPHeaders:{'accept-language':'he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7'}
          });
          const page=await context.newPage();
          page.setDefaultTimeout(120000);
          const pageErrors=[],consoleErrors=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});

          const root=await page.goto('https://app.ravtext.com/',{
            waitUntil:'domcontentloaded',timeout:60000
          });

          const moduleProbe=await page.evaluate(async()=>{
            const url='/assets/pdf_export.js?post1103='+Date.now();
            const response=await fetch(url,{cache:'no-store'});
            const bytes=(await response.clone().arrayBuffer()).byteLength;
            let imported=false,exportType='',importError='';
            try{
              const mod=await import(url);
              imported=true;
              exportType=typeof mod.downloadPagesAsPdf;
            }catch(e){importError=String(e)}
            return {
              url,status:response.status,
              contentType:response.headers.get('content-type')||'',
              bytes,imported,exportType,importError
            };
          });

          await page.evaluate(()=>{
            document.getElementById('post1103-live-probe')?.remove();
            const host=document.createElement('div');
            host.id='post1103-live-probe';
            host.className='pages-container';
            const p=document.createElement('section');
            p.className='page v9-page';
            p.dir='rtl';
            p.style.cssText='position:relative;width:380px;height:537px;padding:24px;box-sizing:border-box;background:white;color:#222;font:22px/1.55 serif;';
            p.innerHTML='<p>בדיקת PDF חיה לאחר תיקון cover</p><p>אב גד הוז חטי כלמ נסע פצק.</p>';
            host.append(p);
            document.body.append(host);
          });

          const downloadPromise=page.waitForEvent('download',{timeout:120000});
          const exportPromise=page.evaluate(async()=>{
            const mod=await import('/assets/pdf_export.js?post1103-export='+Date.now());
            return await mod.downloadPagesAsPdf(
              document.getElementById('post1103-live-probe'),
              {
                filename:'post1103-live-probe.pdf',
                includeBackgrounds:false,
                fallbackToPrint:false,
              }
            );
          });
          const [download,exportResult]=await Promise.all([downloadPromise,exportPromise]);
          const path=await download.path();
          if(!path)throw new Error('download path unavailable');
          const pdf=fs.readFileSync(path);
          fs.writeFileSync(out+'/post1103-live-probe.pdf',pdf);
          const header=pdf.subarray(0,16).toString('latin1');
          const pageObjects=(pdf.toString('latin1').match(/\/Type\s*\/Page\b/g)||[]).length;
          const report={
            rootStatus:root?.status()||0,
            finalUrl:page.url(),
            moduleProbe,
            exportResult,
            suggestedFilename:download.suggestedFilename(),
            pdfBytes:pdf.length,
            pdfSha256:crypto.createHash('sha256').update(pdf).digest('hex'),
            pdfHeader:header,
            pdfPageObjects:pageObjects,
            pageErrors,
            consoleErrors,
          };
          fs.writeFileSync(out+'/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));

          if(report.rootStatus!==200)throw new Error('root HTTP '+report.rootStatus);
          if(moduleProbe.status!==200||!/javascript|ecmascript/i.test(moduleProbe.contentType))
            throw new Error('live module HTTP/content-type invalid');
          if(!moduleProbe.imported||moduleProbe.exportType!=='function')
            throw new Error('live module import failed: '+moduleProbe.importError);
          if(exportResult?.fallback)throw new Error('export unexpectedly fell back: '+JSON.stringify(exportResult));
          if(pdf.length<1000||!header.startsWith('%PDF-'))throw new Error('download is not a valid PDF');
          if(pageObjects<2)throw new Error('expected cover + content page, got '+pageObjects);
          if(pageErrors.length)throw new Error('page errors: '+JSON.stringify(pageErrors));
          await browser.close();
          EOF
          node live-pdf-post1103.mjs
      - name: Upload live acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-pdf-post1103-${{ github.run_id }}
          path: test-results/live-pdf-post1103/
          retention-days: 7
          if-no-files-found: error
