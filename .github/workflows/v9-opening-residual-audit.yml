name: Temporary V9 opening residual matrix audit
on:
  push:
    branches: [audit/v9-opening-residual-matrix-mainf8c6-20261004]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run opening residual matrix
        run: node scripts/v9-unified/run-opening-residual-audit.mjs
      - name: Retain audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-opening-residual-${{ github.run_id }}
          path: test-results/v9-unified/opening-residual-audit.json
          retention-days: 7
