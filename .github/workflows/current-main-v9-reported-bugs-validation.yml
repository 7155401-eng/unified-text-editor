name: Temporary current-main V9 reported-bugs validation

on:
  push:
    branches:
      - test/current-main-v9-reported-bugs-20261001

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check src/vilna_v9.js
          node --check src/engine/v9_main_inline_layout.js
          node --check src/engine/v9_text_measurement.js
          node --check src/engine/v9_bidi_controls.js
      - name: V9 unit regressions
        run: node --test tests/v9-unified/*.test.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser regressions before build
        run: node scripts/v9-unified/run-browser.mjs
      - name: Full build
        run: npm run build
      - name: V9 unit regressions after build
        run: node --test tests/v9-unified/*.test.mjs
      - name: Browser regressions after build
        run: node scripts/v9-unified/run-browser.mjs
