name: Temporary footnotes-to-curly validation

on:
  push:
    branches:
      - feat/word-footnotes-to-curly-20260930

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check cloudflare/docx_footnotes_to_curly.js
          node --check cloudflare/docx_worker_entry.js
          node --check worker/index.js
          node --check src/docx_tools/footnotes_to_curly.js
          node --check src/main.js
          node --check tests/docx/footnotes-to-curly.test.mjs
      - name: DOCX transformation tests
        run: node --test tests/docx/footnotes-to-curly.test.mjs
      - name: Quota and V9 unit regressions
        run: |
          node --test tests/quota/*.test.mjs
          node --test tests/v9-unified/*.test.mjs
      - name: Full build
        run: npm run build
      - name: DOCX tests after build patches
        run: node --test tests/docx/footnotes-to-curly.test.mjs
