name: Apply paired carry input compatibility
on:
  push:
    branches: [fix/v9-paired-carry-input-compat-20261001]
    paths: [.github/workflows/materialize-carry-input-compat.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == '7155401-eng/unified-text-editor' && github.ref == 'refs/heads/fix/v9-paired-carry-input-compat-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: af42923830886d7b9750fad6380d88fe714a642a
      TARGET: fix/v9-paired-carry-input-compat-20261001
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply only the two reviewed source lines and additive regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git hash-object src/vilna_v9.js)" = 30a6a7dd6c36f2b338b4fed2692d9d22d3c4f667
          test "$(git hash-object tests/v9-unified/browser-spacing-regressions.js)" = 4cfe58a709aa3079f57a95b69a38701595e7e341
          printf '%s\n' '61d83761aa8ed9fac53339f78d31d3daa615d4381b263dd97a35ffb3824308f2  .github/patches/carry-input-compat.patch' | sha256sum -c -
          cp .github/patches/carry-input-compat.patch /tmp/carry-input-compat.patch
          git rm .github/patches/carry-input-compat.patch .github/workflows/materialize-carry-input-compat.yml
          git apply --index --check /tmp/carry-input-compat.patch
          git apply --index /tmp/carry-input-compat.patch
          test "$(git hash-object src/vilna_v9.js)" = a225e5e36f50c498d59319e5a0c11dd32d26ae8f
          test "$(git hash-object tests/v9-unified/browser-spacing-regressions.js)" = cfc2aaabe8ddc47a0c908a4a8e19dbe42d2200e3
          git diff --cached --check
          node --check src/vilna_v9.js
          node --check tests/v9-unified/browser-spacing-regressions.js
          printf '%s\n' 'src/vilna_v9.js' 'tests/v9-unified/browser-spacing-regressions.js' | sort > /tmp/expected
          git diff --cached --name-only "$BASE" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
      - name: Publish to feature branch only without force
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v9): preserve supported string rich input when manual shift blocks a footer'
          git push origin "HEAD:refs/heads/$TARGET"
