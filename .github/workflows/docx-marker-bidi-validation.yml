name: Temporary DOCX marker bidi validation
on:
  push:
    branches: [fix/docx-marker-preceding-space-20261001]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
        env: {PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'}
      - run: node --check src/word_extractor/word_extractor_engine.js
      - run: node --test tests/word-extractor/bidi-punctuation-roundtrip.test.mjs
      - run: npm run build
      - run: node --test tests/word-extractor/bidi-punctuation-roundtrip.test.mjs
