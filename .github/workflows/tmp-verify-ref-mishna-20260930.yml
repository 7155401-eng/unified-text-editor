name: Temporary mixed GPT-Mishnah and no-space ref verification

on:
  push:
    branches:
      - fix/ref-no-break-mixed-mishna-20260930

permissions:
  contents: read

concurrency:
  group: tmp-ref-mishna-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/engine/renderer.js
          node --check src/smart_line_breaker.js
          node --check src/vilna_v9.js
          node --check src/vilna_v9_apply.js
          node --check tests/v9-unified/browser-spacing-regressions.js
      - name: Install locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Unit regressions
        run: node --test tests/v9-unified/*.test.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser regressions
        run: node scripts/v9-unified/run-browser.mjs
      - name: Production build
        run: npm run build
