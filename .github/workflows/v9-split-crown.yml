name: Split crown rich-text regression
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/v9-unified/**', 'scripts/v9-unified/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['src/vilna_v9.js', 'tests/v9-unified/split-crown-rich.browser.js', 'scripts/v9-unified/verify-split-crown.mjs', '.github/workflows/v9-split-crown.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  split-crown:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Exact crown rows, grid continuity, coverage and non-overlap
        run: |
          node scripts/v9-unified/verify-split-crown.mjs
          cp test-results/split-crown/report.json test-results/split-crown/before-build.json
          git rev-parse HEAD > test-results/split-crown/tested-commit.txt
          git status --porcelain > test-results/split-crown/status-before-build.txt
      - name: Build with retained diagnostics
        run: npm run build 2>&1 | tee test-results/split-crown/build.log
      - name: All tracked files must remain unchanged after build
        run: |
          git diff --stat | tee test-results/split-crown/source-diff-stat.txt
          git diff > test-results/split-crown/source-diff.patch
          git diff --exit-code
      - name: Repeat exact crown acceptance after build
        run: |
          node scripts/v9-unified/verify-split-crown.mjs
          cp test-results/split-crown/report.json test-results/split-crown/after-build.json
      - name: Retain reports and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: split-crown-${{ github.run_id }}
          path: test-results/split-crown/
          retention-days: 7
