name: Validate mixed Mishnah and no-break refs

on:
  push:
    branches: [fix/mixed-mishna-ref-no-break-20260930]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixed-mishna-ref-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax and unit regressions
        run: |
          node --check src/vilna_v9.js
          node --check src/engine/renderer.js
          node --check src/engine/v9_text_measurement.js
          node --check src/engine/reference_line_glue.js
          node --check src/engine/v9_footer_grouping.js
          node --test tests/v9-unified/*.test.mjs
      - name: Install locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Build
        run: |
          npm run postinstall
          npm run build
          node --test tests/v9-unified/*.test.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser regressions
        run: node scripts/v9-unified/run-browser.mjs
