name: V9 typography and spacing regression verification
on:
  push:
    branches: [fix/build-source-idempotency-20260930]
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'worker/**'
      - 'scripts/**'
      - 'tests/v9-unified/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v9-spacing-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v9-spacing-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fix/build-source-idempotency-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax and unit regressions on committed source
        run: |
          mkdir -p test-results/v9-unified
          git rev-parse HEAD | tee test-results/v9-unified/commit.txt
          node --check src/vilna_v9.js
          node --check src/engine_bridge.js
          node --test tests/v9-unified/*.test.mjs | tee test-results/v9-unified/unit.tap
          test ! -f .github/workflows/v9-apply-candidate-once.yml
          test ! -f .github/v9-candidate-edits-1.b64
          test ! -f .github/v9-build-compat-edits.json
      - name: Locked dependencies
        id: deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser regressions before build
        run: node scripts/v9-unified/run-browser.mjs
      - name: Fetch exact baseline for build comparison
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Compare against the actual PR base, not a historical hard-coded commit.
          # For the dedicated push branch, current main is the correct baseline.
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: .v9-baseline
          persist-credentials: false
      - name: Build baseline with the same locked dependencies
        run: |
          cmp package-lock.json .v9-baseline/package-lock.json
          ln -s "$GITHUB_WORKSPACE/node_modules" .v9-baseline/node_modules
          (cd .v9-baseline; npm run postinstall && npm run build) 2>&1 | tee test-results/v9-unified/baseline-build.log
      - name: Full build and source rewrite integrity
        run: |
          assert_source_clean() {
            echo "=== tracked source state: $1 ==="
            git diff --name-status -- index.html src worker scripts vite.config.js package.json package-lock.json
            git diff --exit-code -- index.html src worker scripts vite.config.js package.json package-lock.json
          }
          npm run postinstall 2>&1 | tee test-results/v9-unified/postinstall.log
          assert_source_clean "after postinstall"
          npm run build 2>&1 | tee test-results/v9-unified/build.log
          node scripts/v9-unified/verify-build-sources.mjs .v9-baseline
          assert_source_clean "after first build"
          npm run build 2>&1 | tee test-results/v9-unified/build-second.log
          assert_source_clean "after second build"
      - name: Repeat unit and browser regressions after build
        run: |
          node --test tests/v9-unified/*.test.mjs | tee test-results/v9-unified/unit-after-build.tap
          cp test-results/v9-unified/browser.json test-results/v9-unified/browser-before-build.json
          node scripts/v9-unified/run-browser.mjs
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-spacing-${{ github.run_id }}
          path: test-results/v9-unified/
          retention-days: 7
