name: V9 typography and spacing regression verification
on:
  push:
    branches: [fix/v9-typography-spacing-regressions]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v9-spacing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/fix/v9-typography-spacing-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Capture exact source revision for isolated analysis
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=zip HEAD src scripts tests package.json package-lock.json vite.config.js > evidence/source.zip
      - name: Unit regression tests
        run: node --test tests/v9-unified/*.test.mjs
      - name: Install locked test dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser regression tests
        run: node scripts/v9-unified/run-browser.mjs
      - name: Retain exact sources and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-spacing-${{ github.run_id }}
          path: |
            evidence/
            test-results/v9-unified/
          retention-days: 3
