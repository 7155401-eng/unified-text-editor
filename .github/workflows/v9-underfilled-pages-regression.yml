name: V9 underfilled pages regression
on:
  push:
    branches: [fix/v9-underfilled-pages-regression]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v9-underfilled-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax and unit tests
        run: |
          node --check src/vilna_v9.js
          node --check src/engine/v9_split_policy.js
          node --test tests/v9-unified/*.test.mjs
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser regressions before build
        run: node scripts/v9-unified/run-browser.mjs
      - name: Full build without source rewrite
        run: |
          mkdir -p /tmp/v9-before
          cp src/vilna_v9.js /tmp/v9-before/vilna_v9.js
          cp src/engine/v9_split_policy.js /tmp/v9-before/v9_split_policy.js
          npm run postinstall
          npm run build
          cmp /tmp/v9-before/vilna_v9.js src/vilna_v9.js
          cmp /tmp/v9-before/v9_split_policy.js src/engine/v9_split_policy.js
      - name: Repeat after build
        run: |
          node --test tests/v9-unified/*.test.mjs
          node scripts/v9-unified/run-browser.mjs
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-underfilled-pages-${{ github.run_id }}
          path: test-results/v9-unified/
          retention-days: 7
          if-no-files-found: warn
