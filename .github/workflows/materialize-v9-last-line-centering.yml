name: Materialize verified V9 last-line fix
on:
  push:
    branches: [fix/v9-last-line-centering-20261001]
    paths: [.github/workflows/materialize-v9-last-line-centering.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == '7155401-eng/unified-text-editor' && github.ref == 'refs/heads/fix/v9-last-line-centering-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: 7a1ba4702ebe9e2b786dad13ecd9d7e48b5ffe7f
      BASE_TREE: c2e285977fe9f686f2c7c761d220d101c2204682
      RESULT_TREE: 0aa8df48db2816c5eef89027795155234d7f826f
      PATCH_SHA: dfb77c4d588ac81d854ffab2f79a55e53438fcc3c7b6341e7488701cfffb156b
      TARGET: fix/v9-last-line-centering-20261001
      PATCH_GZ_BASE64: 
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify immutable base and apply exact reviewed delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          python3 - <<'PY'
          import os,base64,gzip,hashlib,pathlib
          patch=gzip.decompress(base64.b64decode(os.environ['PATCH_GZ_BASE64'],validate=True))
          assert hashlib.sha256(patch).hexdigest()==os.environ['PATCH_SHA'], 'Patch digest mismatch'
          pathlib.Path('/tmp/centering-fix.patch').write_bytes(patch)
          PY
          git rm .github/workflows/materialize-v9-last-line-centering.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index --check /tmp/centering-fix.patch
          git apply --index /tmp/centering-fix.patch
          git diff --cached --check
          test "$(git write-tree)" = "$RESULT_TREE"
          git diff --cached --stat
      - name: Validate focused centering and preservation contracts
        run: node --test tests/v9-unified/opening-final-line-centering.test.mjs tests/v9-unified/spacing-regressions.test.mjs tests/v9-unified/main-bottom-gap-planning.test.mjs tests/v9-unified/combining-mark-runs.test.mjs
      - name: Commit only to the unchanged feature branch; never force or merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$GITHUB_SHA"
          test "$(git write-tree)" = "$RESULT_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v9): restore ordinary final-line centering beside a dropped opening'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD HEAD^{tree}
