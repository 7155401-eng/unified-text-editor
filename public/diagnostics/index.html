<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>בדיקות AI</title><!-- RAVTEXT_DIAGNOSTICS_STATIC_V5 --><style>body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif;line-height:1.55}main{max-width:900px;margin:auto;padding:14px}.b{background:white;border:1px solid #d9e2ef;border-radius:14px;padding:16px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.g{grid-template-columns:1fr}}button,label{border:0;border-radius:10px;padding:10px 14px;margin:4px;background:#1f4fd8;color:white;font-weight:700;cursor:pointer;display:inline-block}.a{background:#e9edf5;color:#172033}.st{border-radius:999px;padding:4px 10px;background:#eef2ff;color:#667085;font-weight:700}.ok{background:#e8f7ee;color:#126b36}.bad{background:#fdecec;color:#9b1c1c}.w{background:#fff4df;color:#965a00}pre{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;background:#eef2ff;border:1px solid #d9e2ef;border-radius:12px;padding:12px;max-height:520px;overflow:auto}input[type=file]{display:none}input[type=password]{width:100%;max-width:520px;padding:10px;border:1px solid #cbd5e1;border-radius:10px;direction:ltr;text-align:left}</style></head><body><main><section class=b><h1>בדיקות AI ללא Console</h1><p>הבדיקה סורקת localStorage/sessionStorage. אם המפתח נשמר במקום אחר, אפשר להדביק אותו כאן זמנית לבדיקה מקומית בדפדפן.</p><input id=manual type=password placeholder="אפשר להדביק כאן מפתח Gemini זמני לבדיקה - לא יוצג בתוצאות"><br><button id=all>הרץ בדיקות 1–3</button><button id=copy class=a>העתק תוצאות</button><button id=down class=a>הורד JSON</button><button id=clear class=a>נקה</button></section><section class=g><div class=b><h2>1. אחסון בדפדפן</h2><button data-r=1>הפעל 1</button> <span id=s1 class=st>טרם הופעל</span></div><div class=b><h2>2. בדיקת Gemini</h2><button data-r=2>הפעל 2</button> <span id=s2 class=st>טרם הופעל</span></div><div class=b><h2>3. שרת בלי קובץ</h2><button data-r=3>הפעל 3</button> <span id=s3 class=st>טרם הופעל</span></div><div class=b><h2>4. קובץ</h2><label for=f>בחר קובץ והפעל 4</label><input id=f type=file accept="audio/*,image/*,.pdf"><div id=fn></div><span id=s4 class=st>טרם הופעל</span></div></section><section class=b><h2>תוצאות לשליחה</h2><pre id=o>אין תוצאות עדיין.</pre></section></main><script>
(()=>{const V='20260727-static-v5-storage-scan-header',LK='ravtext.torah_transcription.config',S={version:V,page:location.href,started_at:new Date().toISOString(),results:{}};$=id=>document.getElementById(id);
const pj=v=>{try{let x=JSON.parse(v||'{}');return x&&typeof x==='object'?x:{}}catch(_){return{}}},cl=v=>String(v??'').replace(/[\u200B-\u200D\uFEFF]/g,'').trim().replace(/\s+/g,'');
const rt=v=>String(v??'').replace(/key=([^&\s"'<>]+)/gi,'key=[redacted]').replace(/AQ\.[0-9A-Za-z_.\-]{16,}/g,'[redacted-gemini-auth-key]').replace(/AIza[0-9A-Za-z_\-]{20,}/g,'[redacted-google-key]').replace(/sk-ant-[0-9A-Za-z_\-]{20,}/g,'[redacted-anthropic-key]').replace(/sk_[0-9A-Za-z_\-]{20,}/g,'[redacted-key]').replace(/Bearer\s+[0-9A-Za-z._\-]{20,}/gi,'Bearer [redacted]');
function safe(v,d=0){if(v==null||typeof v==='number'||typeof v==='boolean')return v;if(typeof v==='string')return rt(v);if(d>6)return'[deep]';if(Array.isArray(v))return v.slice(0,120).map(x=>safe(x,d+1));let o={};for(let[k,x]of Object.entries(v)){if(/api[_-]?key|access[_-]?code|token|secret|password|authorization|value/i.test(k))o[k]=x?`[redacted ${String(x).length} chars]`:'';else if(/content[_-]?base64|base64|blob/i.test(k))o[k]=x?`[omitted ${String(x).length} chars]`:'';else o[k]=safe(x,d+1)}return o}
const poss=v=>{v=cl(v);return v.length>=20&&!/^(true|false|null|undefined)$/i.test(v)&&!/^https?:\/\//i.test(v)&&!(/^[\d.,:-]+$/.test(v))&&/[A-Za-z]/.test(v)&&/[0-9]/.test(v)};
function add(a,p,v,s){v=cl(v);if(!poss(v))return;a.push({provider:p,value:v,storage:s.storage,storage_key:s.storage_key,path:s.path||'',chars:v.length,score:s.score||0})}
function scanVal(v,s,a,d=0){if(v==null||d>8)return;if(typeof v==='string'){let t=v.trim(),j=pj(t);if(Object.keys(j).length){scanVal(j,s,a,d+1);return}if(poss(t)){let c=(String(s.storage_key||'')+'.'+String(s.path||'')).toLowerCase(),p='unknown',score=1;if(/gemini|google|ai[_-]?studio|generative/.test(c)){p='gemini';score=100}else if(/claude|anthropic/.test(c)){p='claude';score=80}else if(/eleven|voice/.test(c)){p='elevenlabs';score=60}else if(/api[_-]?key|apikey|token|secret|key/.test(c))score=20;add(a,p,t,{...s,score})}return}if(Array.isArray(v)){v.forEach((x,i)=>scanVal(x,{...s,path:`${s.path||'$'}[${i}]`},a,d+1));return}if(typeof v==='object')for(let[k,x]of Object.entries(v))scanVal(x,{...s,path:s.path?`${s.path}.${k}`:k},a,d+1)}
function scanStore(st,name){let a=[],keys=[];try{for(let i=0;i<st.length;i++){let k=st.key(i),raw=st.getItem(k),ik=/ravtext|ai|gemini|google|claude|anthropic|eleven|api|key|token|secret|config|setting/i.test(k||''),iv=!!(raw&&/gemini|google|api[_-]?key|apikey|claude|anthropic|eleven|AQ\.|AIza/i.test(raw));keys.push({storage:name,key:k,chars:raw?raw.length:0,interesting:ik||iv});if(!ik&&!iv)continue;let j=pj(raw);scanVal(Object.keys(j).length?j:raw,{storage:name,storage_key:k,path:''},a)}}catch(e){return{candidates:a,scanned_keys:keys,error:e.message||String(e)}}return{candidates:a,scanned_keys:keys}}
function found(){let legacy=pj(localStorage.getItem(LK)),a=[];add(a,'gemini',legacy.gemini_api_key,{storage:'localStorage',storage_key:LK,path:'gemini_api_key',score:legacy.gemini_api_key?200:0});add(a,'claude',legacy.claude_api_key,{storage:'localStorage',storage_key:LK,path:'claude_api_key',score:legacy.claude_api_key?160:0});add(a,'elevenlabs',legacy.elevenlabs_api_key,{storage:'localStorage',storage_key:LK,path:'elevenlabs_api_key',score:legacy.elevenlabs_api_key?140:0});let ls=scanStore(localStorage,'localStorage'),ss=scanStore(sessionStorage,'sessionStorage');a.push(...ls.candidates,...ss.candidates);let by=p=>a.filter(c=>c.provider===p).sort((x,y)=>y.score-x.score||y.chars-x.chars)[0]||null,unk=a.filter(c=>c.provider==='unknown').sort((x,y)=>y.score-x.score||y.chars-x.chars)[0]||null;return{legacy,gemini:by('gemini')||unk,claude:by('claude'),elevenlabs:by('elevenlabs'),candidates:a,scans:{localStorage:ls,sessionStorage:ss}}}
const manual=()=>cl($('manual').value),gkey=()=>manual()||found().gemini?.value||'',model=cfg=>String(cfg.model||'gemini-3.1-pro-preview');
function kinfo(label,c){let raw=String(c?.value||''),clean=cl(raw);return{label,has_key:!!clean,raw_chars:raw.length,cleaned_chars:clean.length,removed_chars:raw.length-clean.length,format_hint:clean?`${label}_key_present_format_not_validated`:'missing',source:c?{storage:c.storage,storage_key:c.storage_key,path:c.path,source_type:c.provider===label?'provider_specific':'fallback_unknown',chars:c.chars,score:c.score}:null}}
function stat(i,r){if(!r)return['st','טרם הופעל'];if(r.error||r.original_error||(r.http_status&&(r.http_status<200||r.http_status>=300)))return['st bad','נכשל: '+(r.possible_cause||r.error||r.original_error||r.http_status)];if(i==='1')return r.config_summary?.gemini?.has_key?['st ok','נמצא מפתח Gemini']:['st bad','לא נמצא מפתח Gemini'];if(i==='2'){if(r.key_valid===false)return['st bad','המפתח נדחה על ידי Gemini'];if(r.key_valid===true)return['st ok','המפתח עבר בדיקת Gemini'];return['st w','בדיקה לא הושלמה']}return['st ok','עבר']}
function render(){['1','2','3','4'].forEach(i=>{let[a,b]=stat(i,S.results[i]),e=$('s'+i);e.className=a;e.textContent=b});$('o').textContent=JSON.stringify(safe({timestamp:new Date().toISOString(),user_agent:navigator.userAgent,manual_key_chars:manual().length,...S}),null,2)}
async function post(url,body,type='application/json'){let t=performance.now(),r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'content-type':type},body:JSON.stringify(body)}),d=await r.json().catch(async()=>({error:'non_json_response',raw:await r.text()}));return{http_status:r.status,response_debug_id_header:r.headers.get('x-ravtext-debug-id'),duration_ms:Math.round(performance.now()-t),...d}}
async function b64(file){return await new Promise((ok,no)=>{let r=new FileReader;r.onerror=()=>no(r.error||Error('file_read_failed'));r.onload=()=>ok(String(r.result||'').split(',')[1]||'');r.readAsDataURL(file)})}
function kind(f){let t=String(f.type||'').toLowerCase(),n=String(f.name||'').toLowerCase();if(t.startsWith('audio/')||/\.(mp3|wav|m4a|ogg|webm|flac)$/i.test(n))return'audio';if(t.startsWith('image/')||/\.(png|jpg|jpeg|webp)$/i.test(n))return'image';if(t==='application/pdf'||/\.pdf$/i.test(n))return'pdf';return'unknown'}
async function r1(){let f=found(),cfg=f.legacy||{},pc=f.candidates.map(c=>({provider:c.provider,storage:c.storage,storage_key:c.storage_key,path:c.path,chars:c.chars,score:c.score}));let man=manual()?{provider:'gemini',value:manual(),storage:'manual_input',storage_key:'manual_input',path:'manual_input',chars:manual().length,score:999}:null;return{diagnostic:'01-browser-storage-scan',version:V,legacy_config_found:!!localStorage.getItem(LK),auth:{has_auth_object:!!window.__RAVTEXT_AUTH__,paid:!!window.__RAVTEXT_AUTH__?.paid,balance_seconds:Number(window.__RAVTEXT_AUTH__?.balanceSeconds||window.__RAVTEXT_AUTH__?.balance_seconds||0)},config_summary:{model:model(cfg),use_premium:cfg.use_premium===true,has_access_code:!!cfg.access_code,manual_key_present:!!manual(),gemini:kinfo('gemini',man||f.gemini),claude:kinfo('claude',f.claude),elevenlabs:kinfo('elevenlabs',f.elevenlabs)},storage_scan_summary:{candidates_count:pc.length,candidates:pc,localStorage_keys:f.scans.localStorage.scanned_keys,sessionStorage_keys:f.scans.sessionStorage.scanned_keys,localStorage_error:f.scans.localStorage.error||null,sessionStorage_error:f.scans.sessionStorage.error||null}}}
async function r2(){let cfg=found().legacy||{};return{diagnostic:'02-gemini-key-isolated',version:V,...await post('/api/ai-tools/diagnose-key',{provider:'gemini',model:model(cfg),api_key:gkey()})}}
async function r3(){let cfg=found().legacy||{};return{diagnostic:'03-gas-minimal',version:V,...await post('/api/ai-tools/gas',{diagnostic:true,diagnostic_name:'03-gas-minimal',prompt_type:'printed',model:model(cfg),api_key:gkey(),text:'Diagnostic ping. Return only: OK',custom_prompt:'Return only the word OK.'},'text/plain;charset=utf-8')}}
async function r4(file){if(!file)return{diagnostic:'04-file-flow',error:'no_file_selected'};let cfg=found().legacy||{},k=kind(file),c=await b64(file);return{diagnostic:'04-file-flow',version:V,file_summary:{name:file.name,mime:file.type,size:file.size,detected_kind:k,base64_chars:c.length},...await post('/api/ai-tools/gas',{diagnostic:true,diagnostic_name:'04-file-flow',prompt_type:k==='audio'?'audio_regular':'printed',model:model(cfg),api_key:gkey(),files:[{name:file.name,type:k,mime:file.type||'application/octet-stream',content_base64:c}],text:k==='audio'?'':'Diagnostic file flow.',custom_prompt:'Return a short technical confirmation.'},'text/plain;charset=utf-8')}}
async function run(i,file=null){let e=$('s'+i);e.className='st';e.textContent='מריץ...';try{S.results[i]=i==='1'?await r1():i==='2'?await r2():i==='3'?await r3():await r4(file);S.results[i].finished_at=new Date().toISOString()}catch(err){S.results[i]={diagnostic:i+'-client-error',error:'client_run_failed',message:err?.message||String(err),stack:err?.stack||'',finished_at:new Date().toISOString()}}render()}
document.addEventListener('click',e=>{let b=e.target.closest('button[data-r]');if(b)run(b.dataset.r)});
$('f').onchange=e=>{let file=e.target.files&&e.target.files[0];$('fn').textContent=file?`${file.name} (${Math.round(file.size/1024)} KB)`:'';if(file)run('4',file)};
$('all').onclick=async()=>{$('all').disabled=true;try{await run('1');await run('2');await run('3')}finally{$('all').disabled=false}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('o').textContent);alert('התוצאות הועתקו')}catch(_){alert('לא הצלחתי להעתיק אוטומטית. נא לסמן ולהעתיק ידנית.')}};
$('down').onclick=()=>{let u=URL.createObjectURL(new Blob([$('o').textContent],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='ravtext-diagnostics.json';a.click();URL.revokeObjectURL(u)};
$('clear').onclick=()=>{S.results={};render()};$('manual').oninput=render;render();
})();
</script></body></html>
